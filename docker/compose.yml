# Postulo on SQLite: one container, one volume, nothing else to run.
#
# This is the recommended shape for a personal instance. SQLite is a single file, which
# makes a backup a file copy, and a job search does not produce the kind of load that
# needs anything more.
#
#   cp .env.example .env      # then set POSTULO_SECRET_KEY and POSTULO_ALLOWED_HOSTS
#   docker compose -f docker/compose.yml up -d
#
# Put a reverse proxy in front of it to terminate TLS. Do not serve /app/data from that
# proxy: uploaded CVs are delivered only through an ownership-checked view.

# Named explicitly. Compose otherwise takes the project name from the directory the
# file sits in, which here is "docker" — so the container becomes docker-postulo-1
# and the volume docker_postulo-data, which is unhelpful on a host running anything
# else. Observed on a real machine, where it sat among a dozen other stacks.
name: postulo

services:
  postulo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # The published image, pinned to a minor: `docker compose pull` takes the next patch
    # and never a surprise. `build:` above still works for anyone building from source;
    # it tags the result with the same name.
    image: source.tiagoagueda.com/tiagoagueda/postulo:0.2
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # The database lives in the volume, not in the image.
      POSTULO_DATABASE_URL: sqlite:////app/data/postulo.sqlite3
    volumes:
      - postulo-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  # Notices reminders falling due and tells their owners through their notifiers. Only
  # needed once somebody has set up a notification connection; start it with
  #   docker compose -f docker/compose.yml --profile scheduler up -d
  # Alternatively run `manage.py send_due_reminders` from the host's cron every few minutes.
  scheduler:
    profiles: ["scheduler"]
    # The published image, pinned to a minor: `docker compose pull` takes the next patch
    # and never a surprise. `build:` above still works for anyone building from source;
    # it tags the result with the same name.
    image: source.tiagoagueda.com/tiagoagueda/postulo:0.2
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTULO_DATABASE_URL: sqlite:////app/data/postulo.sqlite3
      POSTULO_SKIP_MIGRATE: "1"
    volumes:
      - postulo-data:/app/data
    command: ["python", "manage.py", "send_due_reminders", "--loop", "--every", "300"]
    depends_on:
      - postulo

volumes:
  postulo-data:
