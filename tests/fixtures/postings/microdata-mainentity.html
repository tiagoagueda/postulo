<!doctype html>
<!-- The posting is the WebPage's mainEntity: a property of the page-level item, so it is read
     as a value of it and must still be found as the posting the page is about. -->
<html lang="en">
  <head>
    <title>Careers | Black Mesa</title>
  </head>
  <body itemscope itemtype="https://schema.org/WebPage">
    <nav>Home Careers Contact</nav>
    <main itemprop="mainEntity" itemscope itemtype="https://schema.org/JobPosting">
      <h1 itemprop="title">Containment Technician</h1>
      <p>
        <span itemprop="hiringOrganization" itemscope itemtype="https://schema.org/Organization">
          <span itemprop="name">Black Mesa</span>
        </span>
      </p>
      <meta itemprop="employmentType" content="FULL_TIME" />
      <p>Closes <time itemprop="validThrough" datetime="2026-11-01">1 November 2026</time></p>
      <div itemprop="description"><p>Keep the doors shut.</p></div>
    </main>
  </body>
</html>
