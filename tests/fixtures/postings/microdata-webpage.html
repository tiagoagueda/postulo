<!doctype html>
<!-- A theme that wraps the whole page in a WebPage item. The posting inside it carries no
     itemprop, so it is not a property of the page, and it is not the outermost item either:
     the microdata specification counts it a top-level item of its own, and so does this. -->
<html lang="en">
  <head>
    <title>Careers | Black Mesa</title>
  </head>
  <body itemscope itemtype="https://schema.org/WebPage">
    <nav>Home Careers Contact</nav>
    <article itemscope itemtype="https://schema.org/JobPosting">
      <h1 itemprop="title">Anomalous Materials Analyst</h1>
      <p>
        <span itemprop="hiringOrganization" itemscope itemtype="https://schema.org/Organization">
          <span itemprop="name">Black Mesa</span>
        </span>
      </p>
      <p>Based in <span itemprop="jobLocation" itemscope itemtype="https://schema.org/Place"><span itemprop="address">Porto, PT</span></span></p>
      <p>Posted <time itemprop="datePosted" datetime="2026-09-10">10 September 2026</time></p>
      <div itemprop="description"><p>Analyse samples that should not exist.</p></div>
    </article>
    <footer>Black Mesa Research Facility</footer>
  </body>
</html>
