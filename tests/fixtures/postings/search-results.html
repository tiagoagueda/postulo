<!doctype html>
<!-- A board's search page, where the advert being looked at is one of many on it. Every hit
     carries its own JobPosting, and the first one is almost never the one open. This is the
     case that made the reader pick by URL rather than by position: before it did, a capture
     from a search page brought back whichever advert the board happened to list first.

     Here the page is /jobs/2891, and that is the second of three. -->

    <title>Engineering jobs — Black Mesa Careers</title>
    <meta property="og:title" content="Engineering jobs" />

        {
          "@context": "https://schema.org/",
          "@type": "JobPosting",
          "title": "Junior Anomalous Materials Handler",
          "url": "https://careers.blackmesa.example/jobs/1140",
          "hiringOrganization": { "@type": "Organization", "name": "Black Mesa" },
          "jobLocation": { "@type": "Place", "address": { "addressLocality": "Albuquerque", "addressCountry": "US" } },
          "employmentType": "INTERN",
          "datePosted": "2026-07-02"
        },
        {
          "@context": "https://schema.org/",
          "@type": "JobPosting",
          "title": "Research Engineer, Sector C",
          "url": "https://careers.blackmesa.example/jobs/2891",
          "hiringOrganization": { "@type": "Organization", "name": "Black Mesa" },
          "jobLocation": { "@type": "Place", "address": { "addressLocality": "Albuquerque", "addressRegion": "NM", "addressCountry": "US" } },
          "employmentType": "FULL_TIME",
          "description": "&lt;p&gt;Anomalous materials, mostly.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Hard hats provided&lt;/li&gt;&lt;/ul&gt;",
          "baseSalary": {
            "@type": "MonetaryAmount",
            "currency": "usd",
            "value": { "@type": "QuantitativeValue", "minValue": 92000, "maxValue": "118500.50", "unitText": "YEAR" }
          },
          "datePosted": "2026-08-30",
          "validThrough": "2026-11-30"
        },
        {
