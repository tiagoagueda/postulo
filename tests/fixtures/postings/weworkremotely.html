<!doctype html>
<!-- Modelled on a live We Work Remotely advert, September 2026. Four things this board
     does that the synthetic tests never did:
       * no jobLocation at all - the place is on hiringOrganization.address, as a string
       * datePosted is "YYYY-MM-DD HH:MM:SS UTC", space-separated, not an ISO instant
       * employmentType is "Full-Time", hyphenated and in title case
       * baseSalary is a 0-0 placeholder written into every advert whether or not one is stated
     The prose is written here; only the shape is theirs. -->
<html lang="en">
  <head>
    <title>Aperture Science: Senior Test Chamber Engineer</title>
    <meta property="og:title" content="Senior Test Chamber Engineer" />
    <script type="application/ld+json">
      {
        "@context": "http://schema.org/",
        "@type": "JobPosting",
        "title": "Senior Test Chamber Engineer",
        "description": "&lt;p style=&quot;min-height:1.5em&quot;&gt;We build the chambers others only fall through.&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;About the Role:&lt;/strong&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Portal surfaces&lt;/li&gt;&lt;li&gt;Cake logistics&lt;/li&gt;&lt;/ul&gt;",
        "datePosted": "2026-08-18 20:33:08 UTC",
        "validThrough": "2026-09-17 20:33:08 UTC",
        "employmentType": "Full-Time",
        "directApply": "False",
        "occupationalCategory": "Full-Stack Programming",
        "url": "https://weworkremotely.com",
        "jobLocationType": "TELECOMMUTE",
        "baseSalary": {
          "@type": "MonetaryAmount",
          "currency": "USD",
          "value": { "@type": "QuantitativeValue", "minValue": "0", "maxValue": "0", "unitText": "YEAR" }
        },
        "applicantLocationRequirements": [
          { "@type": "Country", "name": "PT" },
          { "@type": "Country", "name": "ES" },
          { "@type": "Country", "name": "FR" }
        ],
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Aperture Science",
          "address": "Remote, Ontario, Canada",
          "sameAs": "https://weworkremotely.com"
        },
        "identifier": {
          "@type": "PropertyValue",
          "name": "Aperture Science",
          "value": "aperture-science-senior-test-chamber-engineer"
        }
      }
    </script>
  </head>
  <body>
    <nav>Remote Jobs Post a Job Sign in</nav>
    <main>
      <h1>Senior Test Chamber Engineer</h1>
      <p>We build the chambers others only fall through.</p>
    </main>
    <footer>Terms Privacy</footer>
  </body>
</html>
