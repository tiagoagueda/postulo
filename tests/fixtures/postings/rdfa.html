<!doctype html>
<!-- RDFa Lite, which a handful of European public boards still publish and nothing else
     does. `vocab` sets the vocabulary, `typeof` opens an item and `property` names a value;
     prefixed names like "schema:title" mean the same thing and appear in the wild, so both
     spellings are here on purpose. -->
<html lang="en">
  <head>
    <title>Vacancy — Ministerie van Testkamers</title>
  </head>
  <body>
    <nav>Vacatures Over ons</nav>
    <main vocab="https://schema.org/" typeof="JobPosting">
      <h1 property="title">Test Chamber Inspector</h1>
      <p property="hiringOrganization" typeof="Organization">
        <span property="name">Ministerie van Testkamers</span>
      </p>
      <p property="jobLocation" typeof="Place">
        <span property="address" typeof="PostalAddress">
          <span property="addressLocality">Den Haag</span>
          <meta property="addressCountry" content="NL" />
        </span>
      </p>
      <meta property="schema:employmentType" content="PART_TIME" />
      <meta property="datePosted" content="2026-09-05" />
      <div property="description">
        <p>Inspect chambers before the public is let into them.</p>
      </div>
    </main>
    <footer>Rijksoverheid</footer>
  </body>
</html>
