<!doctype html>
<!-- A JobPosting hung off an ItemList, which is how several large aggregators publish a
     results page. The posting is two levels down - itemListElement, then item - and a
     reader that only followed @graph never saw it at all: the page read as having no
     structured data and fell through to the fallback.

     The page is /vacancy/77, which is the ListItem at position 2. -->
<html lang="en">
  <head>
    <title>Search results — EuroJobs</title>
    <meta property="og:title" content="Search results" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "JobPosting",
              "title": "Chamber Cleaner",
              "url": "https://eurojobs.example/vacancy/12",
              "hiringOrganization": { "@type": "Organization", "name": "Aperture Science" }
            }
          },
          {
            "@type": "ListItem",
            "position": 2,
            "item": {
              "@type": "JobPosting",
              "title": "Cake Logistics Lead",
              "url": "https://eurojobs.example/vacancy/77",
              "hiringOrganization": { "@type": "Organization", "name": "Aperture Science" },
              "jobLocation": [
                { "@type": "Place", "address": { "addressLocality": "Porto", "addressCountry": "PT" } },
                { "@type": "Place", "address": { "addressLocality": "Madrid", "addressCountry": "ES" } }
              ],
              "employmentType": ["CONTRACT"],
              "description": "Keep the cake moving.",
              "estimatedSalary": {
                "@type": "MonetaryAmount",
                "currency": "EUR",
                "value": { "@type": "QuantitativeValue", "value": 3200, "unitText": "MONTH" }
              },
              "datePosted": "2026-09-10"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <nav>Search Alerts</nav>
    <main>
      <h1>Search results</h1>
    </main>
  </body>
</html>
