<!doctype html>
<!-- RDFa Lite with the WebPage typeof on the body: the JobPosting inside it has no property
     naming it, so it is a top-level resource of its own. -->
<html lang="en">
  <head>
    <title>Vacatures | Ministerie van Testkamers</title>
  </head>
  <body vocab="https://schema.org/" typeof="WebPage">
    <nav>Home Vacatures Contact</nav>
    <div typeof="JobPosting">
      <h1 property="title">Chamber Calibrator</h1>
      <p property="hiringOrganization" typeof="Organization">
        <span property="name">Ministerie van Testkamers</span>
      </p>
      <p property="jobLocation" typeof="Place">
        <span property="address">Utrecht, NL</span>
      </p>
      <meta property="employmentType" content="FULL_TIME" />
      <div property="description"><p>Calibrate the chambers before inspection.</p></div>
    </div>
  </body>
</html>
