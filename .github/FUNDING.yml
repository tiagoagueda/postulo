# GitHub reads this on the mirror and shows a "Sponsor" button on the repository page.
# Forgejo, where the project actually lives, has no equivalent, so the README and the
# wiki carry the button themselves.
#
# Voluntary support is this project's only income. Nothing in Postulo asks for it.
#
# A link cannot say what is being asked for, what it changes, or -- more to the point --
# what it does not. FUNDING.md at the root of the repository says all three: that nothing
# is ever paywalled, that money buys no influence over what gets built, and what is worth
# as much as money to somebody who has none.
#
# The bitcoin address is one address for everything Postulo, public on purpose; a funding link
# must be a web address, so its entry is its history on a block explorer.
