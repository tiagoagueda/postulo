{% load allauth %}
{% comment %} Given a level by its tags where there is one; "danger" and "error" both appear.
   role="alert" so a message that arrives after the page does is announced. {% endcomment %}
<div class="alert mb-4"
     data-variant="{% if 'danger' in attrs.tags or 'error' in attrs.tags %}error{% elif 'warning' in attrs.tags %}warning{% elif 'success' in attrs.tags %}success{% else %}info{% endif %}"
     role="alert">
  {% slot message %}{% endslot %}
</div>
