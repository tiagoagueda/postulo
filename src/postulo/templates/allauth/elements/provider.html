{% load allauth %}
{% comment %} The name comes in as an attribute rather than in the slot, which is why the
   default template prints {{ attrs.name }} and not a slot. Keep both: a caller that fills
   the slot gets what it put there. {% endcomment %}
<a class="btn w-full" data-variant="outline" title="{{ attrs.name }}" href="{{ attrs.href }}">
  {% slot %}{{ attrs.name }}{% endslot %}
</a>
