{% load postulo %}
<div class="mb-4">
  <label class="field-label" for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}<span aria-hidden="true" class="text-red-600">*</span>{% endif %}
  </label>
  {{ field|add_class:"field-input" }}
  {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
