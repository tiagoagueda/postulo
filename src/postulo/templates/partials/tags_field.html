{% load i18n postulo %}
{% comment %}
  Tags as removable labels, with the multiple select underneath for anybody without a
  script. Two forms show tags; this is written once so they cannot drift (#139).
{% endcomment %}
<div class="mb-4" {% include "partials/label_attrs.html" with field=form.tags new_field=form.new_tags %}>
  <span class="label" id="labels-{{ form.tags.html_name }}-heading">{{ form.tags.label }}</span>
  <div class="field" data-labels-existing>
    {{ form.tags }}
    <c-field-feedback :field="form.tags" />
  </div>
  <div class="field mt-3" data-labels-newbox>
    <label for="{{ form.new_tags.id_for_label }}">{{ form.new_tags.label }}</label>
    {{ form.new_tags }}
    <c-field-feedback :field="form.new_tags" />
  </div>
</div>
