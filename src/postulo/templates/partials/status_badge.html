{% load i18n %}
{% comment %}
  Colour carries meaning here: green for progress, red for a closed door, grey for
  something that simply stopped. It is always paired with the label, never alone.
{% endcomment %}
<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium
  {% if status == 'offer' or status == 'accepted' %}
    bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200
  {% elif status == 'interviewing' or status == 'assessment' or status == 'screening' %}
    bg-brand-100 text-brand-800 dark:bg-brand-900/40 dark:text-brand-200
  {% elif status == 'rejected' %}
    bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-200
  {% elif status == 'ghosted' or status == 'withdrawn' %}
    bg-ink-200 text-ink-700 dark:bg-ink-800 dark:text-ink-300
  {% elif status == 'draft' %}
    bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200
  {% else %}
    bg-ink-100 text-ink-700 dark:bg-ink-800 dark:text-ink-200
  {% endif %}">
  {{ label }}
</span>
