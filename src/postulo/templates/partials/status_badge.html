{% load i18n %}
{% comment %}
  Colour carries meaning here: green for progress, red for a closed door, grey for
  something that simply stopped. It is always paired with the label, never alone.
{% endcomment %}
<span class="badge" data-tone="{% if status == 'offer' or status == 'accepted' %}green{% elif status == 'interviewing' or status == 'assessment' or status == 'screening' %}brand{% elif status == 'rejected' %}rose{% elif status == 'draft' %}amber{% else %}grey{% endif %}">
  {{ label }}
</span>
