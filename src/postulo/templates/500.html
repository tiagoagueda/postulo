<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong — Postulo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; display: grid; place-items: center; min-height: 100vh;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; padding: 2rem;
      }
      p.code { font-size: 3rem; font-weight: 600; opacity: 0.25; margin: 0 0 0.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p.detail { opacity: 0.7; font-size: 0.875rem; max-width: 28rem; }
    </style>
  </head>
  <body>
    <div>
      <p class="code">500</p>
      <h1>Something went wrong</h1>
      <p class="detail">
        The error has been logged. If you administer this instance, the server log will
        have the details.
      </p>
      <p><a href="/">Go back</a></p>
    </div>
  </body>
</html>
