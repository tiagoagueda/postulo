{% load i18n %}
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
  <c-stat card href="{% url 'applications:list' %}?state=open" label="{% translate 'Still live' %}">{{ open_count }}</c-stat>
  <c-stat card tone="brand" label="{% translate 'In conversation' %}">{{ interviewing_count }}</c-stat>
  <c-stat card tone="green" label="{% translate 'Offers on the table' %}">{{ offer_count }}</c-stat>
  <c-stat card label="{% translate 'Applied in the last 30 days' %}">{{ applied_recently }}</c-stat>
</div>
