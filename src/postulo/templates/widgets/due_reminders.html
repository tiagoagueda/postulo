{% load i18n %}
<div class="mb-3 flex items-center justify-between">
  <h2 class="font-medium">{{ widget.label }}</h2>
  <a href="{% url 'applications:reminder_create' %}" class="text-sm text-brand-600 underline dark:text-brand-400">
    {% translate "Add" %}
  </a>
</div>
{% if due_reminders %}
  <div class="card p-0">
    <ul class="divide-y divide-ink-100 dark:divide-ink-800">
      {% for reminder in due_reminders %}
        <li class="flex items-start gap-3 px-4 py-3">
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium">{{ reminder.summary }}</p>
            <p class="text-xs text-ink-500 dark:text-ink-400">
              {{ reminder.due_at|date:"j M, H:i" }}
            </p>
          </div>
          <form method="post" action="{% url 'applications:reminder_complete' reminder.pk %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'core:home' %}">
            <button type="submit" class="btn-ghost px-2 py-1 text-xs">
              {% translate "Done" %}
            </button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </div>
{% else %}
  <div class="card text-sm text-ink-500 dark:text-ink-400">
    {% translate "Nothing due." %}
  </div>
{% endif %}
