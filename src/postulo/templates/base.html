{% load i18n static postulo %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en-gb' }}" dir="{{ text_direction|default:'ltr' }}"{% if ui_theme %} data-theme="{{ ui_theme }}"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% comment %} htmx injects a <style> element as it starts, carrying its own rules for the
       request indicator. The production policy sets style-src 'self' with no unsafe-inline,
       so the browser refuses it and logs a violation on every page. Postulo's own stylesheet
       already defines .htmx-indicator and the .htmx-request pair, precisely because inline
       styles are not available here, so what htmx adds is redundant as well as blocked.
       Configured by attribute, which the policy does allow. {% endcomment %}
    {% comment %} `historyCacheSize: 0` with `refreshOnHistoryMiss`, which together mean the
       back button gets a page from the server rather than a photograph of one taken out of
       `sessionStorage` (#226). htmx keeps the body of every page it pushed a URL for, and a
       table swap pushes one on every filter, every sort and every page turn. Restoring that
       copy put back the column-resize handles, the *Select all* button and the label chips
       with none of their listeners attached, and the functions that would have attached them
       then skipped the markers already sitting in the markup -- so Back handed back a page
       whose controls looked exactly like themselves and did nothing at all.

       It also left the applications, the companies and the people somebody had been reading
       in `sessionStorage`, which signing out in the same tab does not touch. A copy of
       personal data that outlives the session is not worth saving a page load for, least of
       all here. Zero makes htmx delete that store the first time it would have written to
       it, so an instance that has been running since before this clears what is already
       there rather than leaving it. {% endcomment %}
    <meta name="htmx-config"
          content='{"includeIndicatorStyles":false,"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
    <meta name="referrer" content="same-origin">
    {% comment %} The instance first, then the page: *Postulo > Dashboard*. A tab, a bookmark,
       the history and a screen reader's announcement all read this, and a page named alone
       could not be told from the same page on any other instance (#196). `>` separates
       levels -- instance, area, page -- and a middle dot qualifies a name inside one level
       (*Report · September 2026*, *Apply · Test Engineer*), so the two never read as the
       same thing. A page fills `title` with its own name; the home page empties the whole
       tail and is the instance's name alone. {% endcomment %}
    <title>{{ instance_name }}{% block title_tail %} &gt; {% block title %}{% endblock %}{% endblock %}</title>
    {% comment %} Three sizes rather than one: a browser picks the nearest and scaling a
       32-pixel mark up to a 180-pixel home screen looks exactly as bad as it sounds. The
       .ico is for anything that still asks for /favicon.ico without being told to.
    {% endcomment %}
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'brand/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'brand/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% url 'core:manifest' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/app.js' %}" defer></script>
  </head>

  {% comment %} The address an open tab collects waiting browser notifications from, only for somebody with a browser notifier switched on (#209). The token travels with it because a page without a form has no other. {% endcomment %}
  {% comment %} Whether one printable character on its own does anything -- "d" and "j" on the
     capture review, "/" for the search box. WCAG 2.1.4 is level A and wants a way to switch
     those off; the switch is under Settings → Appearance and its answer is written here, where
     `app.js` reads it before acting on a key. Only "off" is spelled out, so the attribute
     appears when somebody has asked for something and not otherwise (#227). {% endcomment %}
  <body class="min-h-screen"{% if not keyboard_shortcuts %} data-shortcuts="off"{% endif %}{% if browser_notices %} data-browser-notices="{% url 'notifications:waiting' %}" data-browser-notices-token="{{ csrf_token }}"{% endif %}>
    {# The first thing Tab reaches: past the header, straight to the page. #}
    <a href="#main" class="skip-link">{% translate "Skip to content" %}</a>
    {% comment %} What a failed htmx request says (#226). Every live filter, sort and page
       link on this application replaces a table, and a request that answers 500 or never
       leaves the machine swaps nothing -- so the table went on showing the previous answer
       and the filter simply looked broken. There was no listener for either failure and no
       place to put one.

       One region for the whole application, empty until it has something to say, because a
       live region announces a *change* to text it was already watching; created at the
       moment of the failure it is a race the screen reader loses. The words are here rather
       than in `app.js` so that they are translated like everything else -- the script holds
       no English at all, which is the same rule the notifier card and the password meter
       follow. It says the status because "it did not work" and "it did not work, 503" are
       different problems, and it says that nothing changed because that is the part a
       person cannot see for themselves. {% endcomment %}
    {% comment %} The live region is the paragraph and stays empty until there is something
       to say; the button beside it is outside the region, so the announcement is only ever
       the words. It closes on the button and on Escape, because a fixed box with no way off
       the screen sat over the foot of a long table at 400% zoom (#275). {% endcomment %}
    <div class="page-alert">
      <p role="alert" data-htmx-alert
         data-alert-failed="{% translate 'That did not work — the server answered {status}. Nothing on this page has changed.' %}"
         data-alert-offline="{% translate 'Postulo could not be reached. Nothing on this page has changed.' %}"></p>
      <button type="button" class="btn shrink-0" data-variant="ghost" data-size="icon-xs" data-alert-close
              aria-label="{% translate 'Dismiss' %}">{% icon "x" class="size-4" %}</button>
    </div>
    {% block chrome %}
      {% comment %} The header floats: `sticky top-0`, so the wordmark, the navigation, the
         search and the account menu are there wherever the page has scrolled to (#195).
         Its height is not a constant -- the row wraps on a narrow screen and in a language
         with longer labels -- so `app.js` measures it into `--header-height` on the root,
         and everything that has to clear it (the sticky sidebars, the skip link, the
         anchors through `scroll-padding-top`, the section observer's line) reads that one
         value, with 3.5rem as the answer where scripts do not run. `z-30`: above the page
         and its sticky sidebars, below the skip link's z-50. {% endcomment %}
      <header class="sticky top-0 z-30 border-b border-ink-200 bg-white dark:border-ink-800 dark:bg-ink-900"
              data-site-header>
        {% comment %} `relative` so the narrow-screen navigation panel below can pin itself to
           this row's two edges rather than to wherever the Menu button lands in it. {% endcomment %}
        {% comment %} No cap: the masthead spans the screen, so it never sits narrower than a
           table that has taken the width below it (#188). {% endcomment %}
        <div class="relative flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3">
          {% comment %}
            When the Dashboard link is hidden the wordmark takes the job over properly:
            the active style on the dashboard, and a name that says where it goes.
          {% endcomment %}
          <a href="{% url 'core:home' %}"
             class="flex items-center gap-2 text-lg font-semibold tracking-tight {% if dashboard_hidden %}{% nav_active 'core:home' %} !text-lg !font-semibold{% else %}text-ink-900 dark:text-ink-50{% endif %}"
             {% if dashboard_hidden %}aria-label="{% blocktranslate with name=instance_name trimmed %}{{ name }} — dashboard{% endblocktranslate %}"{% endif %}>
            {% comment %} Decorative: the name is right beside it, and a screen reader
               repeating "Postulo logo, Postulo" helps nobody. {% endcomment %}
            <img src="{% static 'brand/logo-64.png' %}" alt="" width="28" height="28"
                 class="h-7 w-auto shrink-0">
            {{ instance_name }}
          </a>

          {% if user.is_authenticated %}
            {% comment %} The navigation is a row of links at 768 pixels and up, and a
               disclosure below that. Six links come to 635 pixels and a flex row does not
               care about the viewport, so this one element made every page in Postulo
               scroll sideways at 320 -- an AA failure under Reflow, on all of them, while
               the accessibility suite passed because reflow is a question about a width
               and axe is asked about a document (#113).

               A <details>, like the account menu beside it: it opens and closes with no
               script, and the script only adds "close when the pointer goes elsewhere".
               Wrapping the row instead would have been one class, and would have put three
               lines of navigation above every page on a phone. {% endcomment %}
            <details class="md:hidden" data-menu>
              {% comment %} No aria-label: the word beside the icon is the name, which is
                 what a person saying "Menu" to a voice assistant expects to match. {% endcomment %}
              <summary class="nav-link flex cursor-pointer list-none items-center gap-2">
                {% icon "menu" class="size-4" %}{% translate "Menu" %}
              </summary>
              <nav class="absolute inset-x-4 top-full z-20 mt-2 rounded-xl border border-ink-200
                          bg-white p-1 shadow-lg dark:border-ink-800 dark:bg-ink-900"
                   aria-label="{% translate 'Main' %}">
                {% include "partials/nav_links.html" with extra="block" %}
              </nav>
            </details>
            <nav class="hidden items-center gap-1 md:flex" aria-label="{% translate 'Main' %}">
              {% include "partials/nav_links.html" %}
            </nav>

            <div class="ms-auto flex items-center gap-1">
              {# One box over everything. Small until it has focus; "/" jumps to it. #}
              <form method="get" action="{% url 'core:search' %}" role="search"
                    aria-label="{% translate 'Site search' %}" class="hidden md:block">
                <label for="site-search" class="sr-only">{% translate "Search everything" %}</label>
                <input type="search" id="site-search" name="q" value="{% if request.resolver_match.view_name == 'core:search' %}{{ request.GET.q }}{% endif %}"
                       placeholder="{% if keyboard_shortcuts %}{% translate 'Search  /' %}{% else %}{% translate 'Search' %}{% endif %}" data-search-shortcut
                       class="field-input w-32 py-1 text-sm transition-[width] focus:w-64">
              </form>
              {# The account menu: a disclosure the browser opens and closes itself, with #}
              {# the script only adding "close when the pointer goes elsewhere". #}
              {% comment %} Basecoat's popover for the box, and no `role="menu"`: this is
                 navigation -- three links, a switch and sign-out -- and the pattern for that
                 is a disclosure, where Tab moves between the rows. The people table's row
                 actions are a menu of actions and are drawn as one (#262). {% endcomment %}
              <details class="popover" data-menu>
                <summary class="{% nav_active 'accounts:profile' %} flex cursor-pointer items-center gap-2"
                         aria-label="{% blocktranslate trimmed with name=user.display_name %}Account menu, {{ name }}{% endblocktranslate %}">
                  {% avatar user %}
                  <span class="hidden sm:inline">{{ user.display_name }}</span>
                  {% icon "chevron-down" class="size-4 text-ink-400" %}
                </summary>
                <div data-popover data-align="end">
                  <a href="{% url 'accounts:profile' %}" class="menu-item">
                    {% icon "user" %}{% translate "Your details" %}
                  </a>
                  <a href="{% url 'settings:index' %}" class="menu-item">
                    {% icon "settings" %}{% translate "Settings" %}
                  </a>
                  {% if user.is_staff %}
                    <a href="{% url 'server:index' %}" class="menu-item">
                      {% icon "shield" %}{% translate "Server settings" %}
                    </a>
                  {% endif %}
                  <div class="my-1 border-t border-ink-200 dark:border-ink-800" role="separator"></div>
                  {% comment %} The theme switch, as a row of the menu it belongs to: a
                     preference of the person whose menu this is, and the corner then holds
                     one control -- the account -- rather than a sun beside it (#197). The
                     same form, posting the same way; the script finds it by its attribute
                     wherever it sits. {% endcomment %}
                  {% include "core/partials/theme_switch.html" with as_menu_item=True %}
                  <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="menu-item">
                      {% icon "log-out" %}{% translate "Sign out" %}
                    </button>
                  </form>
                </div>
              </details>
            </div>
          {% else %}
            <div class="ms-auto flex flex-wrap items-center gap-2">
              <a href="{% url 'account_login' %}" class="btn" data-variant="outline">{% translate "Sign in" %}</a>
            </div>
          {% endif %}
        </div>
      </header>
    {% endblock %}

    {% comment %} `main_width` is the page's measure: 80rem -- 1280 pixels -- unless the page
       says otherwise. A form, a detail page or a paragraph keeps it, because a wide page is
       not a wide paragraph; a table, the board, the dashboard or a list empties the block
       and takes the screen, which is what they were being denied on any monitor wider than
       a laptop's (#188). So does a page framed by a sidebar -- Your details, Settings,
       Server settings -- because the frame is a grid even when the page inside it is a
       form: the sidebar wants its column and the page wants the rest, and a cap on the pair
       starved both (#198). {% endcomment %}
    <main id="main" tabindex="-1" class="mx-auto {% block main_width %}max-w-7xl{% endblock %} px-4 py-8 outline-none">
      {% include "partials/messages.html" %}
      {# `main` exists so that an area such as Settings can wrap `content` in a layout of #}
      {# its own; pages — allauth's included — keep overriding `content` as they always did. #}
      {% block main %}{% block content %}{% endblock %}{% endblock %}
    </main>

    <footer class="flex flex-wrap gap-x-4 px-4 pb-10 text-xs text-ink-500 dark:text-ink-400">
      <span>
        {% blocktranslate trimmed %}
          Postulo — your job search, on your server.
        {% endblocktranslate %}
      </span>
      <span data-version>Postulo {{ postulo_version }}</span>
    </footer>
    {# Scripts a page needs and the rest do not; always from Postulo's own origin. #}
    {% block scripts %}{% endblock %}
    {% comment %} allauth's pages put theirs in `extra_body` rather than in `scripts`, and a
       block with no home is discarded in silence -- which is how the passkey button came to
       be rendered with nothing wired to it. It sits outside `scripts` so that a base
       overriding that one cannot swallow it. {% endcomment %}
    {% block extra_body %}{% endblock %}
  </body>
</html>
