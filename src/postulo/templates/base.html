{% load i18n static postulo %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en-gb' }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}"{% if ui_theme %} data-theme="{{ ui_theme }}"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% comment %} htmx injects a <style> element as it starts, carrying its own rules for the
       request indicator. The production policy sets style-src 'self' with no unsafe-inline,
       so the browser refuses it and logs a violation on every page. Postulo's own stylesheet
       already defines .htmx-indicator and the .htmx-request pair, precisely because inline
       styles are not available here, so what htmx adds is redundant as well as blocked.
       Configured by attribute, which the policy does allow. {% endcomment %}
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <meta name="referrer" content="same-origin">
    <title>{% block title %}{{ instance_name }}{% endblock %}</title>
    {% comment %} Three sizes rather than one: a browser picks the nearest and scaling a
       32-pixel mark up to a 180-pixel home screen looks exactly as bad as it sounds. The
       .ico is for anything that still asks for /favicon.ico without being told to.
    {% endcomment %}
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'brand/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'brand/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% url 'core:manifest' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/app.js' %}" defer></script>
  </head>

  <body class="min-h-screen">
    {# The first thing Tab reaches: past the header, straight to the page. #}
    <a href="#main" class="skip-link">{% translate "Skip to content" %}</a>
    {% block chrome %}
      <header class="border-b border-ink-200 bg-white dark:border-ink-800 dark:bg-ink-900">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3">
          {% comment %}
            When the Dashboard link is hidden the wordmark takes the job over properly:
            the active style on the dashboard, and a name that says where it goes.
          {% endcomment %}
          <a href="{% url 'core:home' %}"
             class="flex items-center gap-2 text-lg font-semibold tracking-tight {% if dashboard_hidden %}{% nav_active 'core:home' %} !text-lg !font-semibold{% else %}text-ink-900 dark:text-ink-50{% endif %}"
             {% if dashboard_hidden %}aria-label="{% blocktranslate with name=instance_name trimmed %}{{ name }} — dashboard{% endblocktranslate %}"{% endif %}>
            {% comment %} Decorative: the name is right beside it, and a screen reader
               repeating "Postulo logo, Postulo" helps nobody. {% endcomment %}
            <img src="{% static 'brand/logo-64.png' %}" alt="" width="28" height="28"
                 class="h-7 w-auto shrink-0">
            {{ instance_name }}
          </a>

          {% if user.is_authenticated %}
            <nav class="flex items-center gap-1" aria-label="{% translate 'Main' %}">
              {% for item in nav_items %}
                <a href="{% url item.url_name %}" class="{% nav_active_names item.active_names %}"
                   data-nav="{{ item.key }}">{{ item.label }}</a>
              {% endfor %}
            </nav>

            <div class="ml-auto flex items-center gap-1">
              {# One box over everything. Small until it has focus; "/" jumps to it. #}
              <form method="get" action="{% url 'core:search' %}" role="search"
                    aria-label="{% translate 'Site search' %}" class="hidden md:block">
                <label for="site-search" class="sr-only">{% translate "Search everything" %}</label>
                <input type="search" id="site-search" name="q" value="{% if request.resolver_match.view_name == 'core:search' %}{{ request.GET.q }}{% endif %}"
                       placeholder="{% translate 'Search  /' %}" data-search-shortcut
                       class="field-input w-32 py-1 text-sm transition-[width] focus:w-64">
              </form>
              {# The account menu: a disclosure the browser opens and closes itself, with #}
              {# the script only adding "close when the pointer goes elsewhere". #}
              <details class="relative" data-menu>
                <summary class="{% nav_active 'accounts:profile' %} flex cursor-pointer items-center gap-2"
                         aria-label="{% blocktranslate trimmed with name=user.display_name %}Account menu, {{ name }}{% endblocktranslate %}">
                  {% avatar user %}
                  <span class="hidden sm:inline">{{ user.display_name }}</span>
                  {% icon "chevron-down" class="size-4 text-ink-400" %}
                </summary>
                <div class="absolute right-0 z-20 mt-2 w-56 overflow-hidden rounded-xl border border-ink-200 bg-white py-1 shadow-lg dark:border-ink-800 dark:bg-ink-900">
                  <a href="{% url 'accounts:profile' %}" class="menu-item">
                    {% icon "user" %}{% translate "Your details" %}
                  </a>
                  <a href="{% url 'settings:index' %}" class="menu-item">
                    {% icon "settings" %}{% translate "Settings" %}
                  </a>
                  {% if user.is_staff %}
                    <a href="{% url 'server:index' %}" class="menu-item">
                      {% icon "shield" %}{% translate "Server settings" %}
                    </a>
                  {% endif %}
                  <a href="{% url 'core:export' %}" class="menu-item">
                    {% icon "download" %}{% translate "Export everything" %}
                  </a>
                  <div class="my-1 border-t border-ink-200 dark:border-ink-800" role="separator"></div>
                  <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="menu-item">
                      {% icon "log-out" %}{% translate "Sign out" %}
                    </button>
                  </form>
                </div>
              </details>
              {% include "core/partials/theme_switch.html" %}
            </div>
          {% else %}
            <div class="ml-auto flex items-center gap-2">
              <a href="{% url 'account_login' %}" class="btn-secondary">{% translate "Sign in" %}</a>
            </div>
          {% endif %}
        </div>
      </header>
    {% endblock %}

    <main id="main" tabindex="-1" class="mx-auto max-w-7xl px-4 py-8 outline-none">
      {% include "partials/messages.html" %}
      {# `main` exists so that an area such as Settings can wrap `content` in a layout of #}
      {# its own; pages — allauth's included — keep overriding `content` as they always did. #}
      {% block main %}{% block content %}{% endblock %}{% endblock %}
    </main>

    <footer class="mx-auto flex max-w-7xl flex-wrap gap-x-4 px-4 pb-10 text-xs text-ink-500 dark:text-ink-400">
      <span>
        {% blocktranslate trimmed %}
          Postulo — your job search, on your server.
        {% endblocktranslate %}
      </span>
      <span data-version>Postulo {{ postulo_version }}</span>
    </footer>
    {# Scripts a page needs and the rest do not; always from Postulo's own origin. #}
    {% block scripts %}{% endblock %}
    {% comment %} allauth's pages put theirs in `extra_body` rather than in `scripts`, and a
       block with no home is discarded in silence -- which is how the passkey button came to
       be rendered with nothing wired to it. It sits outside `scripts` so that a base
       overriding that one cannot swallow it. {% endcomment %}
    {% block extra_body %}{% endblock %}
  </body>
</html>
