{% load i18n static postulo %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en-gb' }}" dir="{{ text_direction|default:'ltr' }}"{% if ui_theme %} data-theme="{{ ui_theme }}"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% comment %} htmx injects a <style> element as it starts, carrying its own rules for the
       request indicator. The production policy sets style-src 'self' with no unsafe-inline,
       so the browser refuses it and logs a violation on every page. Postulo's own stylesheet
       already defines .htmx-indicator and the .htmx-request pair, precisely because inline
       styles are not available here, so what htmx adds is redundant as well as blocked.
       Configured by attribute, which the policy does allow. {% endcomment %}
    {% comment %} `historyCacheSize: 0` with `refreshOnHistoryMiss`, which together mean the
       back button gets a page from the server rather than a photograph of one taken out of
       `sessionStorage` (#226). htmx keeps the body of every page it pushed a URL for, and a
       table swap pushes one on every filter, every sort and every page turn. Restoring that
       copy put back the column-resize handles, the *Select all* button and the label chips
       with none of their listeners attached, and the functions that would have attached them
       then skipped the markers already sitting in the markup -- so Back handed back a page
       whose controls looked exactly like themselves and did nothing at all.

       It also left the applications, the companies and the people somebody had been reading
       in `sessionStorage`, which signing out in the same tab does not touch. A copy of
       personal data that outlives the session is not worth saving a page load for, least of
       all here. Zero makes htmx delete that store the first time it would have written to
       it, so an instance that has been running since before this clears what is already
       there rather than leaving it. {% endcomment %}
    <meta name="htmx-config"
          content='{"includeIndicatorStyles":false,"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
    <meta name="referrer" content="same-origin">
    {% comment %} The instance first, then the page: *Postulo > Dashboard*. A tab, a bookmark,
       the history and a screen reader's announcement all read this, and a page named alone
       could not be told from the same page on any other instance (#196). `>` separates
       levels -- instance, area, page -- and a middle dot qualifies a name inside one level
       (*Report · September 2026*, *Apply · Test Engineer*), so the two never read as the
       same thing. A page fills `title` with its own name; the home page empties the whole
       tail and is the instance's name alone. {% endcomment %}
    <title>{{ instance_name }}{% block title_tail %} &gt; {% block title %}{% endblock %}{% endblock %}</title>
    {% comment %} Three sizes rather than one: a browser picks the nearest and scaling a
       32-pixel mark up to a 180-pixel home screen looks exactly as bad as it sounds. The
       .ico is for anything that still asks for /favicon.ico without being told to.
    {% endcomment %}
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'brand/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'brand/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% url 'core:manifest' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/app.js' %}" defer></script>
  </head>

  {% comment %} The address an open tab collects waiting browser notifications from, only for somebody with a browser notifier switched on (#209). The token travels with it because a page without a form has no other. {% endcomment %}
  {% comment %} Whether one printable character on its own does anything -- "d" and "j" on the
     capture review, "/" for the search box. WCAG 2.1.4 is level A and wants a way to switch
     those off; the switch is under Settings → Appearance and its answer is written here, where
     `app.js` reads it before acting on a key. Only "off" is spelled out, so the attribute
     appears when somebody has asked for something and not otherwise (#227). {% endcomment %}
  <body class="min-h-screen"{% if not keyboard_shortcuts %} data-shortcuts="off"{% endif %}{% if not nav_underline %} data-nav-underline="off"{% endif %}{% if ui_density == "compact" %} data-density="compact"{% endif %}{% if browser_notices %} data-browser-notices="{% url 'notifications:waiting' %}" data-browser-notices-token="{{ csrf_token }}"{% endif %}>
    {# The first thing Tab reaches: past the header, straight to the page. #}
    <a href="#main" class="skip-link">{% translate "Skip to content" %}</a>
    {% comment %} What a failed htmx request says (#226). Every live filter, sort and page
       link on this application replaces a table, and a request that answers 500 or never
       leaves the machine swaps nothing -- so the table went on showing the previous answer
       and the filter simply looked broken. There was no listener for either failure and no
       place to put one.

       One region for the whole application, empty until it has something to say, because a
       live region announces a *change* to text it was already watching; created at the
       moment of the failure it is a race the screen reader loses. The words are here rather
       than in `app.js` so that they are translated like everything else -- the script holds
       no English at all, which is the same rule the notifier card and the password meter
       follow. It says the status because "it did not work" and "it did not work, 503" are
       different problems, and it says that nothing changed because that is the part a
       person cannot see for themselves. {% endcomment %}
    {% comment %} The live region is the paragraph and stays empty until there is something
       to say; the button beside it is outside the region, so the announcement is only ever
       the words. It closes on the button and on Escape, because a fixed box with no way off
       the screen sat over the foot of a long table at 400% zoom (#275). {% endcomment %}
    <div class="page-alert">
      <p role="alert" data-htmx-alert
         data-alert-failed="{% translate 'That did not work — the server answered {status}. Nothing on this page has changed.' %}"
         data-alert-offline="{% translate 'Postulo could not be reached. Nothing on this page has changed.' %}"></p>
      <button type="button" class="btn shrink-0" data-variant="ghost" data-size="icon-xs" data-alert-close
              aria-label="{% translate 'Dismiss' %}">{% icon "x" class="size-4" %}</button>
    </div>
    {% block chrome %}
      {% comment %} The header floats: `sticky top-0`, so the wordmark, the navigation, the
         search and the account menu are there wherever the page has scrolled to (#195).
         Its height is not a constant -- an instance with a long name, or a row that does
         not fit, wraps -- so `app.js` measures it into `--header-height` on the root,
         and everything that has to clear it (the sticky sidebars, the skip link, the
         anchors through `scroll-padding-top`, the section observer's line) reads that one
         value, with 3.5rem as the answer where scripts do not run. `z-30`: above the page
         and its sticky sidebars, below the skip link's z-50.

         Below `md` the navigation inside it is a bar fixed to the foot of the window
         (#299): out of the header's flow, so not in its height, and measured into
         `--bottom-bar-height` instead. Fixed to the window *from inside the header*, so
         nothing on the header may start a containing block of its own -- a `transform`,
         a `filter`, a `backdrop-filter`, `contain` or `will-change` -- or the bar would be
         fixed to the header and ride along at the top of the page. {% endcomment %}
      <header class="sticky top-0 z-30 border-b border-ink-200 bg-white dark:border-ink-800 dark:bg-ink-900"
              data-site-header>
        {% comment %} No cap: the masthead spans the screen, so it never sits narrower than a
           table that has taken the width below it (#188). {% endcomment %}
        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3">
          {% comment %}
            When the Dashboard link is hidden the wordmark takes the job over properly:
            the active style on the dashboard, and a name that says where it goes.
          {% endcomment %}
          <a href="{% url 'core:home' %}"
             class="flex items-center gap-2 text-lg font-semibold tracking-tight {% if dashboard_hidden %}{% nav_active 'core:home' %} !text-lg !font-semibold{% else %}text-ink-900 dark:text-ink-50{% endif %}"
             {% if dashboard_hidden %}aria-label="{% blocktranslate with name=instance_name trimmed %}{{ name }} — dashboard{% endblocktranslate %}"{% endif %}>
            {% comment %} Decorative: the name is right beside it, and a screen reader
               repeating "Postulo logo, Postulo" helps nobody. {% endcomment %}
            <img src="{% static 'brand/logo-64.png' %}" alt="" width="28" height="28"
                 class="h-7 w-auto shrink-0">
            {{ instance_name }}
          </a>

          {% if user.is_authenticated %}
            {% include "partials/nav_links.html" %}

            <div class="ms-auto flex items-center gap-1">
              {% comment %} Search, in two shapes for two widths (#299). From `lg` up, one box
                 over everything: small until it has focus, and "/" jumps to it. Below that
                 the box would take the row's room, and on a phone there was no search at
                 all -- so it is a link to the search page, which has a box of its own and
                 works with scripts off. An icon standing alone, so it carries the name; 44
                 pixels square, the target a thumb wants, like the account button beside
                 it. The box grows by half rather than doubling: the row beside it is
                 counted to fit with the box open, and every pixel the box takes when it
                 opens is a pixel the row cannot have. {% endcomment %}
              <a href="{% url 'core:search' %}" class="btn size-11 lg:hidden" data-variant="ghost" data-size="icon"
                 data-search-link aria-label="{% translate 'Search' %}">{% icon "search" class="size-5" %}</a>
              <form method="get" action="{% url 'core:search' %}" role="search"
                    aria-label="{% translate 'Site search' %}" class="hidden lg:block">
                <label for="site-search" class="sr-only">{% translate "Search everything" %}</label>
                <input type="search" id="site-search" name="q" value="{% if request.resolver_match.view_name == 'core:search' %}{{ request.GET.q }}{% endif %}"
                       placeholder="{% if keyboard_shortcuts %}{% translate 'Search  /' %}{% else %}{% translate 'Search' %}{% endif %}" data-search-shortcut
                       class="w-32 py-1 text-sm transition-[width] focus:w-48">
              </form>
              {% comment %} The + menu: what a person can start from anywhere (#282). A menu
                 of actions, so `role="menu"` is the right one here -- unlike the account
                 disclosure beside it, which is navigation. `<c-dropdown-menu>` is the
                 component for it: a popover the browser opens with no script, and the
                 arrow keys `app.js` already adds to `.dropdown-menu`.

                 *Listing* goes to the capture, because that is how a listing usually
                 starts -- pasting the address of the posting -- and the by-hand entry is
                 one click away from Listings. *Application* was not in the list the menu
                 was asked for and is included on purpose, not by accident. *Reminder* is
                 in for *event*: an event belongs to an application and has no route that
                 makes one from nowhere, so the masthead offers the thing that is global
                 and the thing somebody actually wants from a corner of the screen (#282).
                 *Documents* is three rows under a heading rather than a submenu, because
                 a submenu does not open with the scripts off. {% endcomment %}
              <c-dropdown-menu label="{% translate 'New' %}">
                <c-slot name="trigger">{% icon "plus" %}</c-slot>
                <a href="{% url 'jobs:capture_create' %}" role="menuitem">
                  {% icon "briefcase" %}{% translate "Listing" %}
                </a>
                <a href="{% url 'applications:create' %}" role="menuitem">
                  {% icon "send" %}{% translate "Application" %}
                </a>
                <a href="{% url 'jobs:company_create' %}" role="menuitem">
                  {% icon "building-2" %}{% translate "Company" %}
                </a>
                <a href="{% url 'applications:reminder_create' %}" role="menuitem">
                  {% icon "bell" %}{% translate "Reminder" %}
                </a>
                <hr role="separator">
                {% comment %} The three documents as an ARIA `group` inside the menu (#282):
                   a `group` is what a menu may own for a labelled set of items, so the
                   label is a name on the group rather than a heading. A heading would also
                   sit in the document before every page's <h1>, and the masthead may not
                   carry one. The items are still found by the menu's arrow-key walk, which
                   queries `role="menuitem"` by descent. {% endcomment %}
                <div role="group" aria-label="{% translate 'Documents' %}">
                  <div
                      class="px-3 pb-1 pt-2 text-xs font-medium text-ink-500 dark:text-ink-400">{% translate "Documents" %}</div>
                  <a href="{% url 'documents:cv_create' %}" role="menuitem">
                    {% icon "file-text" %}{% translate "CV" %}
                  </a>
                  <a href="{% url 'documents:letter_create' %}" role="menuitem">
                    {% icon "mail" %}{% translate "Cover letter" %}
                  </a>
                  <a href="{% url 'documents:upload_create' %}" role="menuitem">
                    {% icon "upload" %}{% translate "Upload a file" %}
                  </a>
                </div>
              </c-dropdown-menu>
              {# The account menu: a popover the browser opens and closes itself. #}
              {% comment %} The same component as the + menu beside it (#310), of the other
                 kind: no `role="menu"`, because this is navigation -- the person, three
                 links, a switch and sign-out -- and the pattern for that is a disclosure,
                 where Tab moves between the rows. The people table's row actions are a
                 menu of actions and are drawn as one (#262).

                 The trigger is the avatar and nothing else (#282): the name it used to
                 carry is a row of the menu now, so the `aria-label` is the control's only
                 name and stays. The chevron stays with it, because with the name gone it
                 is the only thing saying "this opens something". `p-2` is not padding for
                 looks: 28 pixels of avatar plus 8 on each side is the 44 a thumb wants,
                 and the avatar itself stays the size every other place in the interface
                 draws it. {% endcomment %}
              <c-dropdown-menu kind="navigation" trigger_variant="" trigger_size=""
                               trigger_class="{% nav_active 'accounts:profile' %} flex cursor-pointer items-center gap-2 rounded-full p-2"
                               label="{% blocktranslate trimmed with name=user.display_name %}Account menu, {{ name }}{% endblocktranslate %}">
                <c-slot name="trigger">
                  {% avatar user %}
                  {% icon "chevron-down" class="size-4 text-ink-400" %}
                </c-slot>
                {% comment %} Who is signed in, at the top of the menu whose trigger used
                   to say it. The name on its own, with the email under it: *Signed in
                   as* reads as a security statement and the quieter form is the
                   decision, made once here rather than left to the template (#282). A
                   label, not a destination -- *Your details* below is the link. {% endcomment %}
                <div class="flex items-center gap-2 px-3 py-2">
                  {% avatar user %}
                  <div class="min-w-0">
                    <div class="truncate text-sm font-medium text-ink-900 dark:text-ink-50">{{ user.display_name }}</div>
                    {% comment %} The address is a single unbreakable word in a menu 224
                       pixels wide: truncate would ellipsize it under the text-spacing
                       override (SC 1.4.12), and the full address is nowhere else on the
                       page, so it wraps instead of being cut -- `break-words` keeps it
                       one line when it fits and lets it break when it does not (#282). {% endcomment %}
                    <div class="break-words text-xs text-ink-500 dark:text-ink-400">{{ user.email }}</div>
                  </div>
                </div>
                <a href="{% url 'accounts:profile' %}" class="menu-item">
                  {% icon "user" %}{% translate "Your details" %}
                </a>
                <a href="{% url 'settings:index' %}" class="menu-item">
                  {% icon "settings" %}{% translate "Settings" %}
                </a>
                {% if user.is_staff %}
                  <a href="{% url 'server:index' %}" class="menu-item">
                    {% icon "shield" %}{% translate "Server settings" %}
                  </a>
                {% endif %}
                <div class="my-1 border-t border-ink-200 dark:border-ink-800" role="separator"></div>
                {% comment %} The theme switch, as a row of the menu it belongs to: a
                   preference of the person whose menu this is, and the corner then holds
                   one control -- the account -- rather than a sun beside it (#197). The
                   same form, posting the same way; the script finds it by its attribute
                   wherever it sits. {% endcomment %}
                {% include "core/partials/theme_switch.html" with as_menu_item=True %}
                <form method="post" action="{% url 'account_logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="menu-item">
                    {% icon "log-out" %}{% translate "Sign out" %}
                  </button>
                </form>
              </c-dropdown-menu>
            </div>
          {% else %}
            <div class="ms-auto flex flex-wrap items-center gap-2">
              <a href="{% url 'account_login' %}" class="btn" data-variant="outline">{% translate "Sign in" %}</a>
            </div>
          {% endif %}
        </div>
      </header>
    {% endblock %}

    {% comment %} `main_width` is the page's measure: 80rem -- 1280 pixels -- unless the page
       says otherwise. A table, the board, the dashboard or a list empties the block and
       takes the screen, which is what they were being denied on any monitor wider than a
       laptop's (#188). So does a page framed by a sidebar -- Your details, Settings, Server
       settings -- because the frame is a grid even when the page inside it is a form: the
       sidebar wants its column and the page wants the rest, and a cap on the pair starved
       both (#198). And so does a form that sets its parts side by side on a wide screen
       from `2xl`: the company form's details and identifiers (#210), a contact's details
       and its rows of numbers and links, and the capture form beside what it does (#320).

       So the line is not what a page holds but where its measure lives. A page that sets
       its parts side by side, each with a width of its own -- a table in its scroll box, a
       card that stops at `max-w-2xl` at the start edge, as those forms' columns do -- takes
       the screen. A page whose measure is the page's -- a form in one column, a detail
       page, a paragraph -- keeps this cap, because a wide page is not a wide paragraph.
       Inside a frame the measure is the page's own: Your details and every page of
       Settings stop at `max-w-2xl` at the start edge of the column beside the sidebar,
       except the import's mapping, whose tables take the width (#320). The forms under
       Server settings keep none yet, and their boxes run the width of the frame. The
       listing form keeps this cap: two of its 768-pixel columns need a window of 1592,
       which no breakpoint names. {% endcomment %}
    <main id="main" tabindex="-1" class="mx-auto {% block main_width %}max-w-7xl{% endblock %} px-4 py-8 outline-none">
      {% include "partials/messages.html" %}
      {# `main` exists so that an area such as Settings can wrap `content` in a layout of #}
      {# its own; pages — allauth's included — keep overriding `content` as they always did. #}
      {% block main %}{% block content %}{% endblock %}{% endblock %}
    </main>

    {% comment %} The foot of every page, allauth's included (#212): this instance first, then
       what it runs on, where its code is, where the help is, and who answers for it. Small
       and muted on purpose -- one line on a wide screen, two on a phone -- and never a
       request for money, which is asked in the README and on Server settings -> Overview
       and nowhere else (#172).

       The instance says its own name, and its tagline when it has one; Postulo's slogan is
       for an instance nobody has named. Both are typed text in any script, so each is a
       `<bdi>` and neither is translated.

       The version is for people signed in. It is the first thing a stranger would want in
       order to know which advisories apply, and a stranger has no other use for it; *Powered
       by Postulo* is said to everybody. Not a secret -- `/healthz` still says it, to a
       monitor -- but no longer on every page a crawler reads. It links to that release's
       notes: the release it says it is, since nothing a build records says which commit it
       came from.

       *Source code* is the offer of source the AGPL asks of a modified Postulo run as a
       service, pointing wherever `POSTULO_SOURCE_URL` says the operator's code lives. The
       legal notice is the operator's to give, and is absent until they do. Every address
       leaves the instance, so each is marked `external` and opens beside the page; nothing
       here is fetched, so the policy has nothing to allow.

       `py-1` on each item, so a link at this size is 24 pixels tall -- the target size a
       pointer wants -- without leaning on the space around it. {% endcomment %}
    <footer class="flex flex-wrap items-center justify-between gap-x-4 px-4 pb-10 text-xs text-ink-500 dark:text-ink-400">
      <p class="py-1">
        {% if instance_tagline %}
          <bdi>{{ instance_name }}</bdi> — <bdi>{{ instance_tagline }}</bdi>
        {% elif instance_named %}
          <bdi>{{ instance_name }}</bdi>
        {% else %}
          {% blocktranslate trimmed %}
            Postulo — your job search, on your server.
          {% endblocktranslate %}
        {% endif %}
      </p>
      <nav aria-label="{% translate 'About this instance' %}">
        <ul class="flex flex-wrap gap-x-4">
          <li>
            {% if user.is_authenticated %}
              <a href="{{ postulo_release_url }}" rel="noopener noreferrer external" target="_blank"
                 class="inline-block py-1 underline underline-offset-2 hover:text-ink-700 dark:hover:text-ink-200"
                 data-version>{% blocktranslate trimmed with version=postulo_version %}Powered by Postulo {{ version }}{% endblocktranslate %}</a>
            {% else %}
              <span class="inline-block py-1">{% translate "Powered by Postulo" %}</span>
            {% endif %}
          </li>
          <li>
            <a href="{{ postulo_source_url }}" rel="noopener noreferrer external" target="_blank"
               class="inline-block py-1 underline underline-offset-2 hover:text-ink-700 dark:hover:text-ink-200"
               data-source>{% translate "Source code" %}</a>
          </li>
          <li>
            <a href="{{ postulo_help_url }}" rel="noopener noreferrer external" target="_blank"
               class="inline-block py-1 underline underline-offset-2 hover:text-ink-700 dark:hover:text-ink-200"
               data-help>{% translate "Help" %}</a>
          </li>
          {% if postulo_legal_notice_url %}
            <li>
              <a href="{{ postulo_legal_notice_url }}" rel="noopener noreferrer external" target="_blank"
                 class="inline-block py-1 underline underline-offset-2 hover:text-ink-700 dark:hover:text-ink-200"
                 data-legal-notice>{% translate "Legal notice" %}</a>
            </li>
          {% endif %}
        </ul>
      </nav>
    </footer>
    {# Scripts a page needs and the rest do not; always from Postulo's own origin. #}
    {% block scripts %}{% endblock %}
    {% comment %} allauth's pages put theirs in `extra_body` rather than in `scripts`, and a
       block with no home is discarded in silence -- which is how the passkey button came to
       be rendered with nothing wired to it. It sits outside `scripts` so that a base
       overriding that one cannot swallow it. {% endcomment %}
    {% block extra_body %}{% endblock %}
  </body>
</html>
