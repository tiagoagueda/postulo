{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Tag" %}{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="mb-6 text-2xl font-semibold tracking-tight">{% translate "Tag" %}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="card mb-6">
        {% for field in form %}
          {% include "partials/field.html" with field=field %}
        {% endfor %}
      </div>
      <div class="flex items-center gap-3">
        <button type="submit" class="btn-primary">{% translate "Save" %}</button>
        <a href="{% url 'applications:tag_list' %}" class="btn-ghost">{% translate "Cancel" %}</a>
      </div>
    </form>
  </div>
{% endblock %}
