# Vendored libraries and the compiled stylesheet are artefacts: reformatting them
# only creates churn the next time they are regenerated.
exclude: ^(src/postulo/static/js/vendor/|src/postulo/static/css/app\.css$|package-lock\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The ESCO classification (#266) is a few megabytes on purpose: it ships in the
        # repository and is read from it at runtime. The limit stays a guard for the rest.
        exclude: ^src/postulo/jobs/data/esco-[^/]+\.json$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      - id: uv-lock
