# Vendored libraries and the compiled stylesheet are artefacts: reformatting them
# only creates churn the next time they are regenerated.
exclude: ^(src/postulo/static/js/vendor/|src/postulo/static/css/app\.css$|package-lock\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The browser suite's own DejaVu Sans, which it draws every page in so a desktop
        # and CI measure the same widths (#717): two of the four faces are over 500 KB.
        exclude: ^tests/e2e/fonts/
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      - id: uv-lock

  # Translations are made in Weblate and come back as its pull request (#706): a commit
  # made here may add an empty slot and change the English, and nothing else about a
  # translation. CI reads every commit with the same check; this says so before it is made.
  - repo: local
    hooks:
      - id: translations-come-from-weblate
        name: translations come from Weblate
        entry: uv run python scripts/messages.py guard --staged
        language: system
        files: \.po$
        pass_filenames: false
