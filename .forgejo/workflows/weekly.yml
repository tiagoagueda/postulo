# What a week without a push would miss (#1136).
#
# Two things change under Postulo while nobody pushes: the advisory databases, where a
# vulnerability is disclosed in a dependency that was fine on Friday, and the ESCO service,
# whose answers the loader reads in a particular shape. Both are looked at every Monday
# here. Until #1136 the schedule sat on `ci.yml` and ran the whole of it, browser suite
# included, to get these two.
#
# Every Python has its own weekly run, half an hour later, in `every-python.yml`.
name: Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# No `permissions:` block: reading is what a job has without asking, and Forgejo 16 ignores
# the field and warns about it (#727).

env:
  # Kept in step with `ci.yml`, whose comments say why each is pinned.
  UV_VERSION: "0.12.17"
  UV_INSTALLER_SHA256: "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5"
  ESCO_REVISION: "1.2.1"

jobs:
  security:
    name: Security audit
    # The `security` job of `ci.yml`, step for step; its comments are there. A copy,
    # because a workflow here cannot call another, and `ci.yml` keeps its own for the
    # release gate, which requires the audit on the commit it tags.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Audit the Python dependencies
        run: |
          uv export --no-emit-project --all-groups --all-extras --format requirements-txt --no-hashes \
            > /tmp/locked-requirements.txt
          uvx pip-audit==2.10.1 --strict --progress-spinner off --disable-pip --no-deps \
            -r /tmp/locked-requirements.txt
        timeout-minutes: 10

      - name: Audit the asset build's Node dependencies
        run: npm audit --package-lock-only --audit-level=high
        timeout-minutes: 5

      - name: Audit the workflows themselves
        run: >
          uvx zizmor==1.30.1 --offline --no-progress --config .forgejo/zizmor.yml
          --min-severity medium .forgejo/workflows/*.yml
        timeout-minutes: 10

  esco:
    name: ESCO still answers in the shape the loader reads
    # The download validates the files it writes, so a changed API fails here on a Monday
    # rather than on the day somebody's cache expires. No cache on purpose: the unit jobs
    # keep the classification between runs (#714), which is why they cannot be this check.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    env:
      # `uv run` uses what the sync step built, without the browser group (#1135).
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Install dependencies
        run: uv sync --locked --python 3.14 --no-group e2e
        timeout-minutes: 5

      - name: Download the ESCO classification
        run: uv run manage.py fetch_esco --revision "$ESCO_REVISION"
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test
        timeout-minutes: 10
