# Builds the container image for a release tag and pushes it to Forgejo's registry.
#
# Started by hand, and that is the whole point. This job needs a runner advertising the
# `docker` label, because it talks to a Docker daemon and the default runner cannot (see
# scripts/check-image.sh). Forgejo schedules a job before it evaluates the condition that
# would skip it, so a job asking for a label no runner advertises does not get skipped and
# does not fail: it queues, for ever, and the run it belongs to never finishes. That is
# what happened to v0.2.0's release, which was published and complete while its workflow
# run sat in `waiting` looking unfinished (#81).
#
# A workflow nobody starts cannot queue. So this is `workflow_dispatch`: somebody who has
# registered a docker runner asks for the tag they want built, and the release workflow
# next door has one job and always completes. The repository variable that used to gate it
# is gone with the automatic trigger it gated -- a switch on a thing that only happens when
# you press the button is a second way of saying no.
#
# **It is also where the image is scanned** (#156). Everything in #155 and #157 was found by
# running two scanners by hand on a machine that happened to have them; neither finding was
# new, and both had been in the image since it was built. A scan somebody remembers to run
# is not a scan the project runs. So the native-architecture image is built and scanned
# first, and the multi-architecture push happens only if that passes -- a gate after the
# push would be a report about something already published.
name: Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, for example v0.3.0"
        required: true

# Nothing is granted by default; this needs to read the code and write to the registry.
permissions: {}

jobs:
  image:
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag asked for, rather than whatever the default branch is now. A release
          # image built from a moving branch is an image nobody can reproduce.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Work out the tags
        id: tags
        env:
          # Through the environment rather than expanded into the script: a value that
          # reaches a shell as text is data, one that is pasted into it is code.
          RELEASE_TAG: ${{ inputs.tag }}
          # `GITHUB_SERVER_URL` is the address the *runner* reaches Forgejo at, which on a
          # compose deployment is an internal name -- `http://server:3000`. The daemon that
          # pushes runs on the host, cannot resolve that, and an image named after it could
          # not be pulled by anybody. So the registry is the `REGISTRY_HOST` repository
          # variable, falling back to the server URL with either scheme stripped, for an
          # instance where the two are the same (#190).
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          version="${RELEASE_TAG#v}"
          registry="${REGISTRY_HOST:-${GITHUB_SERVER_URL#http*://}}"
          image="${registry}/${GITHUB_REPOSITORY}"
          echo "tags=${image}:${version},${image}:${version%.*},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          registry="${REGISTRY_HOST:-${GITHUB_SERVER_URL#http*://}}"
          echo "$REGISTRY_TOKEN" | docker login "$registry" \
            -u "$REGISTRY_USER" --password-stdin

      # Built for this runner only, into its daemon, so there is something to scan. The
      # multi-architecture build below reuses the layers, so this costs a scan rather than
      # a second build.
      - name: Build the image this runner can scan
        run: docker build -f docker/Dockerfile -t postulo:scan .

      # The same script a person runs, rather than a second description of the same
      # intent that can drift from it. Both scanners, gated on findings with a fix
      # available: six unfixable CRITICALs is the normal state of a Debian base image, and
      # a gate that fails every day for reasons nobody can act on is switched off within a
      # fortnight.
      #
      # Both tools download a vulnerability database, so this step needs the network.
      - name: Scan it, with both scanners
        run: ./scripts/scan-image.sh postulo:scan

      # The half nobody writes down. The scan that produced #155 and #157 also came back
      # clean on secrets and misconfiguration, and that result is worth keeping: it says
      # the image is in the state somebody thinks it is.
      - name: Record what the scan found, including the part that was clean
        if: always()
        run: |
          {
            echo '## Image scan'
            echo
            echo '<details><summary>Everything both scanners saw, fixable or not</summary>'
            echo
            echo '```'
            cat .scan/trivy-full.txt 2>/dev/null || echo 'no report'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # A signed list of what is in the image is more use to somebody self-hosting Postulo
      # than this run's verdict: it lets them scan the release later, against a database
      # that does not exist yet.
      - name: Keep the bill of materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.tag }}
          path: .scan/sbom.cdx.json
          if-no-files-found: warn

      - name: Build for amd64 and arm64 and push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          docker buildx create --use --name postulo-release >/dev/null 2>&1 || docker buildx use postulo-release
          tags=""
          for tag in $(echo "$TAGS" | tr ',' ' '); do tags="$tags -t $tag"; done
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile $tags --push .
