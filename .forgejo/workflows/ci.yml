# CI runs on Forgejo. The GitHub mirror deliberately has no workflow of its own:
# GitHub ignores .forgejo/, so the mirror stays a mirror instead of a second CI bill.
#
# `runs-on` must name a label the Forgejo runner actually advertises, which is shown
# under Settings -> Actions -> Runners. A label no runner has does not fail the job: it
# queues it for ever, which looks exactly like CI passing until somebody checks.
#
# Only `actions/checkout` is used, and nothing else from any action marketplace. Forgejo
# resolves bare action names against its own instance rather than GitHub, so an action
# published only on GitHub -- setup-uv and setup-node among them -- may not resolve at
# all. Installing those two tools directly is a few more lines and no guesswork.
name: CI

on:
  push:
    # `main` and every release branch. Work moved onto per-release branches after 0.2.0
    # closed, and for a while nothing pushed there was checked at all: the filter said
    # `main` and the commits were going somewhere else. A branch whose name starts with a
    # digit is a release branch here -- 0.3.0, 0.4.0, and whatever follows them.
    branches: [main, "[0-9]*"]
  pull_request:
  schedule:
    # The dependency audit below also runs weekly, so a vulnerability disclosed in a
    # library is noticed even in a week when nothing was pushed.
    - cron: "17 6 * * 1"

# Every job here only reads the repository.
permissions:
  contents: read

env:
  # The one version of uv every job installs, the same one .pre-commit-config.yaml and
  # docker/Dockerfile name. The installer at astral.sh/uv/install.sh hands out whatever is
  # newest, and a lock file read by an unpinned tool is pinned only in name (#233). Bump all
  # three together.
  UV_VERSION: "0.12.17"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Debian with Node and git already present. uv brings its own Python, so nothing
      # else needs installing, and the image is a fraction of the size of a full
      # Actions runner image.
      image: node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        # WeasyPrint is the default renderer and loads Pango through the system linker.
        # With these present the suite exercises real PDF rendering rather than skipping
        # the one test that needs a working backend.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Keep uv's downloads between runs
        # Forgejo's runner serves the cache API the action talks to. Should this instance's
        # not, the step is skipped rather than failed -- the run then downloads what the
        # last one did, which is what it always did.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        # Without the browser group: Playwright is 136 MB of tool this job never starts, and
        # `default-groups` would otherwise install it on every leg of the matrix (#233).
        run: uv sync --locked --python ${{ matrix.python-version }} --no-group e2e

      - name: Lint
        run: |
          uv run ruff check --output-format=full .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test

      - name: Check the translation catalogues are current and consistent
        # Every string in the source has a slot in every catalogue, every translation
        # keeps the placeholders of its original, and the plural rules match the table.
        run: |
          uv run python scripts/messages.py extract --check
          uv run python scripts/messages.py check

      - name: Compile the translations
        run: uv run python scripts/messages.py compile

      - name: Download the ESCO classification
        # Not committed: a few megabytes of reference data, and the fetch validates
        # the file it writes, which is the check that it still shapes what the tests pin.
        run: uv run manage.py fetch_esco --revision 1.2.1
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test

      - name: Test
        # Two processes, not `-n auto` (#233): the three legs of this matrix run at once on
        # one host, and `auto` gave each of them a worker per host core. Run 539 spent 59
        # minutes on a suite that takes 4 serially, and starved every other job on the box
        # -- the postgres leg took 27 minutes over 41 tests, the browser leg 12 minutes to
        # install Chromium, the image scan an hour -- until the runner's limit ended them.
        # The in-memory database and the temporary directories are each process's own.
        if: matrix.python-version != '3.14'
        run: uv run pytest -n 2

      - name: Test, and measure what the suite covers
        # On one leg only: measuring slows the run, and three copies of the same number are
        # not three facts. `fail_under` in pyproject.toml is the floor it must clear.
        if: matrix.python-version == '3.14'
        run: uv run pytest -n 2 --cov --cov-report=term-missing

      - name: Production settings deployment check
        # check --deploy, and collectstatic with the manifest storage the image uses,
        # which follows references inside CSS and JS and refuses one that points at
        # nothing — the failure that once broke the image build and not the tests.
        run: |
          uv run manage.py check --deploy --fail-level WARNING
          uv run manage.py collectstatic --noinput --clear
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.prod
          # Long enough to satisfy security.W009; not a real secret.
          POSTULO_SECRET_KEY: ci-only-placeholder-nS7pQ2xV9wR4tY6uI8oA3sD5fG1hJ0kL2zX4cV6b
          POSTULO_ALLOWED_HOSTS: postulo.example.org
          POSTULO_STATIC_ROOT: /tmp/postulo-static

  postgres:
    # The other engine Postulo offers, against a real server (#219).
    #
    # The job above runs on in-memory SQLite, which is what makes it fast, and it meant
    # that `docker/compose.postgres.yml` and the *Installing Postulo* page had been
    # offering PostgreSQL since `7675bf10d` without a single line of it ever executing.
    # The image had no driver and no pg_dump; `core/backup.py`'s PostgreSQL half was
    # covered only by a monkeypatched `subprocess.run`. None of that is the kind of
    # mistake reading finds -- it is the kind a server finds in ten seconds.
    #
    # A subset rather than the whole suite: the pages, the permissions and the
    # translations do not change with the engine, and the matrix above already runs them
    # three times. What does change is whether the driver imports, whether the migrations
    # apply, and whether the backup path -- which shells out to pg_dump and pg_restore
    # instead of copying a file -- actually works. That is what this runs, and then it
    # takes a real backup of a seeded instance and puts it back.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    services:
      db:
        # The same major as `docker/compose.postgres.yml` starts, and the reason the
        # client below is installed by major as well: pg_dump refuses a server newer
        # than itself, so testing against 15 would prove nothing about the deployment.
        image: postgres:17
        env:
          POSTGRES_DB: postulo
          POSTGRES_USER: postulo
          # This server exists for the length of one job, holds fictional data, and is
          # reachable only from the container beside it.
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U postulo -d postulo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install the PostgreSQL client tools
        # From PostgreSQL's own repository and by major version, exactly as
        # `docker/Dockerfile` does it: Debian bookworm ships client 15, and pg_dump
        # against a 17 server aborts on the version mismatch. If this step and the image
        # ever disagree, CI is testing something nobody runs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-17
          rm -rf /var/lib/apt/lists/*
          pg_dump --version

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # --extra postgres, which is where psycopg lives and what the image was missing.
        run: uv sync --locked --python 3.14 --extra postgres --no-group e2e

      - name: Compile the translations
        run: uv run python scripts/messages.py compile

      - name: Run the database-facing tests against PostgreSQL
        # POSTULO_TEST_DATABASE_URL is the only thing that moves the suite off in-memory
        # SQLite; everything else about the test settings stays as it is.
        run: uv run pytest tests/test_smoke.py tests/test_ownership.py tests/test_backup.py
        env:
          POSTULO_TEST_DATABASE_URL: postgres://postulo:ci-only-not-a-secret@db:5432/postulo

      - name: Take a backup and put it back, for real
        # Production settings, the shape an operator actually runs, and no monkeypatching
        # anywhere: migrate applies through psycopg, seed_demo writes a believable search,
        # backup shells out to pg_dump, a second account is added so that the restore has
        # something to undo, and restore --force runs pg_restore and has to leave exactly
        # the one account the archive held.
        run: |
          mkdir -p /tmp/postulo-media /tmp/postulo-backups /tmp/postulo-static
          uv run manage.py migrate --noinput
          uv run manage.py seed_demo demo@example.org --no-pdf --password ci-only-not-a-secret-either
          uv run manage.py backup /tmp/postulo-roundtrip.tar.gz
          uv run manage.py seed_demo rival@example.org --no-pdf --password ci-only-not-a-secret-either
          uv run manage.py restore /tmp/postulo-roundtrip.tar.gz --force
          uv run manage.py shell -c "
          from django.contrib.auth import get_user_model
          from postulo.applications.models import Application
          emails = sorted(get_user_model().objects.values_list('email', flat=True))
          assert emails == ['demo@example.org'], emails
          assert Application.objects.exists(), 'the restore brought back an empty instance'
          "
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.prod
          POSTULO_DATABASE_URL: postgres://postulo:ci-only-not-a-secret@db:5432/postulo
          # Long enough to satisfy security.W009; not a real secret.
          POSTULO_SECRET_KEY: ci-only-placeholder-nS7pQ2xV9wR4tY6uI8oA3sD5fG1hJ0kL2zX4cV6b
          POSTULO_ALLOWED_HOSTS: postulo.example.org
          POSTULO_MEDIA_ROOT: /tmp/postulo-media
          POSTULO_BACKUP_DIR: /tmp/postulo-backups
          POSTULO_STATIC_ROOT: /tmp/postulo-static

  security:
    # Postulo holds people's CVs and employment histories, and one of its stated
    # commitments is to keep them as secure as it knows how. Part of that is noticing a
    # vulnerability disclosed in a dependency without anyone having to remember to look:
    # every Python package in the lock file and every Node package used to build the
    # assets is checked against the advisory databases, on every push and every week.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit the Python dependencies
        # The lock file rather than the installed environment, and the difference is why
        # this job failed on every run for a fortnight: `uv sync` installs Postulo itself
        # as an editable package, `--strict` fails on anything it cannot look up, and
        # Postulo is not on PyPI. The audit never reported on the dependencies at all --
        # it stopped at the project. Exporting the lock without the project audits exactly
        # what will be installed and keeps `--strict`, so a dependency that becomes
        # unauditable still fails the build, which is the whole point of it.
        run: |
          uv export --no-emit-project --all-groups --format requirements-txt --no-hashes \
            > /tmp/locked-requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit --strict --progress-spinner off \
            -r /tmp/locked-requirements.txt

      - name: Audit the asset build's Node dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit the workflows themselves
        # A workflow is code that runs with the repository's credentials; zizmor checks
        # for injected expressions, over-broad permissions and unpinned actions.
        #
        # `--offline` is not a concession, it is the correct mode here. zizmor takes a
        # GitHub token from GH_TOKEN or GITHUB_TOKEN, Forgejo Actions sets the latter, and
        # zizmor then asked github.com about `actions/checkout` using a Forgejo token --
        # which github.com answered with 401, failing the whole job. But the deeper problem
        # is that the question was wrong: Forgejo resolves a bare action name against its
        # own instance, as the note at the top of this file says, so what GitHub thinks
        # `actions/checkout@v4` refers to is not what runs here. The online audits would
        # give a confident answer about the wrong host.
        #
        # This is also why it passed on a laptop: with no token in the environment zizmor
        # defaults to offline, so the failure only ever appeared in CI.
        #
        # Pinned, like pip-audit above and uv itself: an auditor that changes under the
        # project is one whose new rule fails a push that changed nothing (#233).
        run: >
          uvx zizmor==1.30.1 --offline --no-progress --config .forgejo/zizmor.yml
          --min-severity medium .forgejo/workflows/*.yml

  styles:
    # The compiled stylesheet is committed so that the application runs without Node.
    # That only works if it is kept in step with its source.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - run: npm ci

      - name: Rebuild the stylesheet
        run: npm run build:css

      - name: Re-copy the icons
        run: npm run sync:icons

      - name: Re-copy the vendored scripts
        run: npm run sync:vendor

      - name: Fail if the committed stylesheet or icons are out of date
        run: |
          # A container-backed runner may check out as a different user than the one
          # running the steps, and git then refuses to read the repository at all.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- src/postulo/static/css/app.css \
            || (echo "::error::app.css is stale. Run 'npm run build:css' and commit the result." && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/icons)" \
            || (echo "::error::static/icons disagrees with assets/icons.txt. Run 'npm run sync:icons' and commit the result." && git status --porcelain -- src/postulo/static/icons && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/js/vendor)" \
            || (echo "::error::static/js/vendor disagrees with node_modules. Run 'npm run sync:vendor' and commit the result." && git status --porcelain -- src/postulo/static/js/vendor && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/brand)" \
            || (echo "::error::static/brand disagrees with assets/brand/postulo.png. Run 'uv run python scripts/brand.py' and commit the result." && git status --porcelain -- src/postulo/static/brand && exit 1)

  browser:
    # The critical path in a real browser: sign in, capture, review, board, send, export.
    # One Python version is enough; the matrix above covers the interpreter, this covers
    # the pages joining up. Traces and screenshots of a failure are kept as artifacts.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Keep uv's downloads and the browser between runs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/uv
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: browser-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --python 3.14 --group e2e

      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: Install axe-core for the accessibility checks
        run: npm ci

      - name: Compile the translations
        run: uv run python scripts/messages.py compile

      - name: Drive the critical path in a browser
        run: >
          uv run pytest -m e2e --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure --output browser-artifacts

      - name: Keep the trace and screenshots of a failure
        # v3 works on Forgejo Actions; v4 depends on GitHub's own artifact backend.
        if: failure()
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: browser-failure
          path: browser-artifacts
