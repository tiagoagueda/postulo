# CI runs on Forgejo. The GitHub mirror deliberately has no workflow of its own:
# GitHub ignores .forgejo/, so the mirror stays a mirror instead of a second CI bill.
#
# `runs-on` must name a label the Forgejo runner actually advertises, which is shown
# under Settings -> Actions -> Runners. A label no runner has does not fail the job: it
# queues it for ever, which looks exactly like CI passing until somebody checks.
#
# Three actions are used, all of them from Forgejo's own copy of the standard set, and
# nothing else from any action marketplace: `actions/checkout`, which every job needs;
# `actions/cache`, which keeps uv's downloads and the browser between runs and is
# `continue-on-error`, so a cache that is down costs time and fails nothing; and
# `actions/upload-artifact`, kept on v3 because v4 depends on GitHub's own artifact
# backend, which Forgejo does not have, and also `continue-on-error`. Forgejo resolves
# bare action names against its own instance rather than GitHub, so an action published
# only on GitHub -- setup-uv and setup-node among them -- may not resolve at all.
# Installing those two tools directly is a few more lines and no guesswork.
#
# The jobs start in the order this file lists them. The runner takes two jobs at a time
# and hands them out in file order, so the longest one comes first: listed last, the
# browser job waited nineteen minutes for a slot behind the unit legs and the checks, and
# a push took 55 minutes to report (#712).
#
# Time limits sit on the steps that run the tests, not on the jobs: this runner
# (forgejo-runner 6.4) ignores a job's `timeout-minutes` and honours a step's. Both were
# tried on a throwaway branch (#712), and a job-level `if` was found to fail its job rather
# than skip it, which is why nothing here is skipped that way.
name: CI

on:
  push:
    # `main` and every release branch. Work moved onto per-release branches after 0.2.0
    # closed, and for a while nothing pushed there was checked at all: the filter said
    # `main` and the commits were going somewhere else. A release branch is named for its
    # version, 0.3.0, 0.4.0, so the filter asks for three numbers and two dots.
    #
    # Not `"[0-9]*"`, which is what it was. Since every issue has a branch named after its
    # number (#940), `933-date-pickers` matched it too, and one push to an issue branch ran
    # this workflow twice, on `push` and on `pull_request`, for the same commit, plus both
    # legs of Every Python: 122 runner-minutes on a runner with two slots, where 48 test
    # exactly as much (#1033). An issue branch is checked by its pull request, which runs on
    # every push to it; a branch pushed before its pull request exists is unchecked until it
    # does, so open one early, as a draft if the work is unfinished. `main` keeps its push
    # run because the release gate and the dev image's wait read its `(push)` statuses.
    branches: [main, "[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  schedule:
    # The dependency audit below also runs weekly, so a vulnerability disclosed in a
    # library is noticed even in a week when nothing was pushed.
    - cron: "17 6 * * 1"

# A newer push to the same pull request or branch cancels the run it supersedes: nobody
# reads the result of a commit that is no longer the tip, and on two slots it delays the one
# they will read (#1033). `dev-image.yml` does the same, so this Forgejo honours the block.
# `main` is never cancelled: every commit on it keeps its own run, keyed on the commit
# rather than the branch, because the release gate reads each commit's statuses and the dev
# image waits for its own commit's CI. The event is in the key as well, so the weekly run on
# `main` cannot cancel a push run of the same commit. A pull request is keyed on its number.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number
    || github.ref_name == 'main' && github.sha
    || github.ref }}
  cancel-in-progress: true

# Every job here only reads the repository, which is what a job has without asking. There
# is no `permissions:` block on purpose: Forgejo 16 does not support the field and warns
# that it is ignored, and capabilities beyond reading are granted to a job through the
# instance's Authorized Integrations, not by the workflow. `.forgejo/zizmor.yml` says the
# same to zizmor, which would otherwise ask for the block.

env:
  # The one version of uv every job installs, the same one .pre-commit-config.yaml and
  # docker/Dockerfile name. The installer at astral.sh/uv/install.sh hands out whatever is
  # newest, and a lock file read by an unpinned tool is pinned only in name (#233). Bump all
  # three together.
  UV_VERSION: "0.12.17"
  # The sha256 of that version's install.sh, checked before it is run: the script is the
  # trust root for the uv binary it then fetches, and `curl | sh` ran whatever the address
  # answered (#790). Bump it with UV_VERSION, see CONTRIBUTING.md.
  UV_INSTALLER_SHA256: "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5"
  # The ESCO revision the unit legs download, and the key their copy of it is kept under:
  # the loader refuses a directory holding two revisions (`jobs/esco.py`), so the key is the
  # revision and nothing else (#714).
  ESCO_REVISION: "1.2.1"

jobs:
  browser:
    name: Browser tests (Chromium)
    # The critical path in a real browser: sign in, capture, review, board, send, export.
    # One Python version is enough; the matrix below covers the interpreter, this covers
    # the pages joining up. A failure is run again alone with a trace, kept as an artifact.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install the system libraries of WeasyPrint and Chromium
        # WeasyPrint's, as in the unit job, and in the same apt run the ones Playwright's
        # `install --with-deps chromium` installed for Debian 12 (Playwright 1.62): the
        # browser's libraries and the fonts a page falls back on for scripts DejaVu lacks.
        # `--with-deps` ran apt again on every run, 29 s with the browser itself restored
        # from the cache (#1033). Not xvfb, the one other package it installed: a headless
        # browser draws without a display. A Playwright that needs another library names it
        # when the browser fails to start; it goes here.
        #
        # Not `--only-shell` either, which would skip the full Chromium:
        # `tests/e2e/test_web_app.py` starts it (`channel="chromium"`) to install the app.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libglib2.0-0 libnspr4 libnss3 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            libfreetype6 fonts-noto-color-emoji fonts-unifont xfonts-scalable fonts-liberation \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Only a push to a branch the project controls may fall back to an older cache by prefix: on
      # a pull request the key is exact, so a run of somebody else's code cannot read or seed what
      # `main` restores (#827).
      - name: Keep uv's downloads and the browser between runs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/uv
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ github.event_name != 'pull_request' && format('browser-{0}-', runner.os) || '' }}

      - name: Install dependencies
        run: uv sync --locked --python 3.14 --group e2e

      - name: Install Chromium for Playwright
        # The browser alone: its system libraries came with WeasyPrint's, above.
        run: uv run playwright install chromium

      - name: Install axe-core for the accessibility checks
        run: npm ci

      - name: Keep the compiled translations between runs
        # Compiling every catalogue took 18 to 37 s of each job that runs tests (#1033), and
        # the result changes only with what the key hashes: every catalogue, the compiler, the
        # language table it reads and the version it writes into status.json. Exact keys only,
        # on every event: an older set of `.mo` files is a set of stale translations, not a
        # head start.
        id: catalogues
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            src/postulo/**/LC_MESSAGES/django.mo
            src/postulo/locale/status.json
          key: catalogues-${{ hashFiles('src/postulo/**/LC_MESSAGES/django.po', 'scripts/messages.py', 'src/postulo/core/messages_tool.py', 'src/postulo/core/languages.py', 'src/postulo/__init__.py') }}

      - name: Compile the translations
        if: steps.catalogues.outputs.cache-hit != 'true'
        run: uv run python scripts/messages.py compile

      - name: Drive the critical path in a browser
        id: e2e
        # `--durations` ends the log with the slowest tests: the suite grew from 149 to 645
        # tests in five days, and the list is where to look before adding to it (#712).
        #
        # No trace and no screenshot here. pytest-playwright's `retain-on-failure` and
        # `only-on-failure` record both for every test and throw them away when it passes,
        # because it cannot know beforehand which one will fail: 645 traces and pictures to
        # keep the files of the rare failure (#715). The step below makes them for the
        # failed tests alone.
        #
        # One process. Two (`-n 2 --dist worksteal`, #721) saved two minutes in run 723 and
        # cost three failures that passed alone: beside the unit job on the same six-core
        # host, a Chromium went thirty seconds without answering a click, and the job went
        # back to one process (#726). The suite runs on workers without change -- each gets
        # its own live server, database and Chromium, and tests/e2e/conftest.py starts the
        # long walks first.
        #
        # Measured again once an issue branch ran CI once, through its pull request (#1033):
        # two workers were green on runs 1658 and 1691 (29 October 2026), beside a unit job of
        # two. Then the unit job went to three workers (#1085), and run 1720 (30 October)
        # took 32 minutes instead of 24 and failed four tests that passed alone, the target
        # size walk, the phone walk in dark, the site search's panel and the board's column
        # names: three unit workers, two browser workers and the PostgreSQL job on six cores,
        # run 723 again. Two browser workers need the unit job back on fewer workers, or a
        # runner of their own.
        run: uv run pytest -m e2e --browser chromium --durations=25
        # Half again what the suite took on 4 October 2026, so a hang ends here, with
        # pytest's stack dump of the test that hung above it, rather than at the runner's
        # own limit with nothing said.
        timeout-minutes: 45

      - name: Run the failed tests again, alone, with a trace
        # Diagnosis, never a retry: the job stays failed whatever this does (#715). What it
        # adds is a trace of each failed test, and a second opinion. Failing again alone,
        # the test fails on its own merits; passing alone, it was a flake or it depends on
        # the tests that ran before it, and either is a bug to file with this trace.
        #
        # Only when the test step itself failed: `failure()` alone is also true when an
        # install step did, and then there is nothing to run again. `-m e2e` again, because
        # the default `-m` in pyproject.toml deselects every browser test, and one process,
        # so the test runs as nearly alone as it can.
        if: failure() && steps.e2e.outcome == 'failure'
        run: |
          # How loaded the host is, so a failure that passes alone can be read against it:
          # starved of processor, or of memory (run 723).
          uptime; nproc; free -m; cat /proc/pressure/cpu /proc/pressure/memory 2>/dev/null || true
          if uv run pytest -m e2e --browser chromium --last-failed --last-failed-no-failures none \
              -p no:xdist --tracing on --screenshot on --output browser-artifacts; then
            echo "::warning::The failed tests pass when run again alone: a flake, or a test that depends on the ones before it. The job stays failed; the trace is in the browser-failure artifact."
          else
            echo "::error::The failed tests fail again when run alone. The trace is in the browser-failure artifact."
            exit 1
          fi

      - name: Keep the trace and screenshots of a failure
        # v3 works on Forgejo Actions; v4 depends on GitHub's own artifact backend.
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: browser-failure
          path: browser-artifacts

  test:
    # Named for what it checks (#319). The 3.14 leg is the one that measures coverage.
    name: "${{ matrix.python-version == '3.14' && 'Unit tests and coverage' || 'Unit tests' }} (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    container:
      # Debian with Node and git already present. uv brings its own Python, so nothing
      # else needs installing, and the image is a fraction of the size of a full
      # Actions runner image.
      image: node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        # The newest Python alone, on every push (#713). The older ones the project supports
        # run the same job in `every-python.yml`, weekly, on release branches and when started
        # by hand; a release needs them all (`scripts/release_tools.py`). In the measured
        # fortnight before this the three legs only ever failed together, on real faults.
        # Not a matrix computed from the event: this Forgejo expands a matrix before it knows
        # the event, so such an expression always takes its last branch (#713).
        python-version: ["3.14"]

    # Only what depends on the interpreter. Lint, the migrations, the catalogues and the
    # production settings read the same on every Python, so they run once, in `checks`
    # below, instead of once per leg (#712).
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        # WeasyPrint is the default renderer and loads Pango through the system linker.
        # With these present the suite exercises real PDF rendering rather than skipping
        # the one test that needs a working backend.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Keep uv's downloads between runs
        # Forgejo's runner serves the cache API the action talks to. Should this instance's
        # not, the step is skipped rather than failed -- the run then downloads what the
        # last one did, which is what it always did.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ github.event_name != 'pull_request' && format('uv-{0}-{1}-', runner.os, matrix.python-version) || '' }}

      - name: Install dependencies
        # Without the browser group: Playwright is 136 MB of tool this job never starts, and
        # `default-groups` would otherwise install it on every leg of the matrix (#233).
        run: uv sync --locked --python ${{ matrix.python-version }} --no-group e2e

      - name: Keep the compiled translations between runs
        # Compiling every catalogue took 18 to 37 s of each job that runs tests (#1033), and
        # the result changes only with what the key hashes: every catalogue, the compiler, the
        # language table it reads and the version it writes into status.json. Exact keys only,
        # on every event: an older set of `.mo` files is a set of stale translations, not a
        # head start.
        id: catalogues
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            src/postulo/**/LC_MESSAGES/django.mo
            src/postulo/locale/status.json
          key: catalogues-${{ hashFiles('src/postulo/**/LC_MESSAGES/django.po', 'scripts/messages.py', 'src/postulo/core/messages_tool.py', 'src/postulo/core/languages.py', 'src/postulo/__init__.py') }}

      - name: Compile the translations
        # The suite reads compiled catalogues: a page in Portuguese is only Portuguese if
        # its `.mo` exists, and the `.mo` files are not committed.
        if: steps.catalogues.outputs.cache-hit != 'true'
        run: uv run python scripts/messages.py compile

      - name: Keep the ESCO classification between runs
        # Downloading it took half a minute of every leg and asked an outside service
        # on every push, and a slow or rate-limited answer failed the leg (#714). The
        # weekly run does not look here, so it always downloads, and that download stays
        # the check that the API still answers in the shape the loader reads.
        id: esco
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            src/postulo/jobs/data/esco-${{ env.ESCO_REVISION }}.json
            src/postulo/jobs/data/esco-skills-${{ env.ESCO_REVISION }}.zip
          key: esco-${{ env.ESCO_REVISION }}

      - name: Download the ESCO classification
        # Not committed: megabytes of reference data, the occupations and the skills, and
        # the fetch validates the files it writes, which is the check that the API still
        # answers in the shape the loader reads and the tests pin.
        if: steps.esco.outputs.cache-hit != 'true'
        run: uv run manage.py fetch_esco --revision "$ESCO_REVISION"
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test

      - name: Test
        # Two processes, not `-n auto` (#233): the jobs of this workflow share one host,
        # and `auto` gave each of them a worker per host core. Run 539 spent 59 minutes on a
        # suite that takes 4 serially, and starved every other job on the box -- the
        # postgres leg took 27 minutes over 41 tests, the browser leg 12 minutes to install
        # Chromium, the image scan an hour -- until the runner's limit ended them. The
        # in-memory database and the temporary directories are each process's own.
        #
        # Three fit the job container's 2 GB since #1033. Each worker used to grow towards
        # 1 GB over the suite (#830), and with three (run 1658) the kernel killed two of them
        # at the same second. What grew was every language a worker met, kept for good:
        # Django's catalogues, its `reverse()` tables and CLDR's locales, for all 86
        # languages, which an instance never loads at once and a worker always did.
        # `tests/conftest.py` drops them after a test file that met more than four, and
        # `--dist loadgroup` hands `tests/test_translations.py`, which parses every catalogue
        # (over 250 MB while it runs), to one worker rather than to all three at once.
        # Measured on Windows on 29 October 2026: one process through the whole suite ended
        # at 881 MB rather than 1,124, with a peak of 1,106 rather than 1,421, and in 35
        # minutes rather than 44, the collector having fewer objects to walk; three workers
        # peaked at 606, 754 and 965 MB, the last the one given the catalogues, before they
        # were trimmed by a further 130 MB. A worker past 700 MB again is worth a look before
        # anything adds a fourth.
        #
        # Back to two since #1184: on 31 October a worker was killed again in this 2 GB (runs
        # 1778 and 1793, both in the measured step, `--cov` adding to each worker), and xdist,
        # having replaced it, never finished, so the job hung to the runner's deadline with
        # every test it reached passed. `--max-worker-restart=0` makes a killed worker fail
        # the job at once, with the test it was running in the report. Three are for #1033 to
        # measure again.
        if: matrix.python-version != '3.14'
        run: uv run pytest -n 2 --max-worker-restart=0 --dist loadgroup --durations=25
        timeout-minutes: 30

      - name: Test, and measure what the suite covers
        # On one leg only: measuring slows the run, and three copies of the same number are
        # not three facts. `fail_under` in pyproject.toml is the floor it must clear.
        if: matrix.python-version == '3.14'
        run: uv run pytest -n 2 --max-worker-restart=0 --dist loadgroup --durations=25 --cov --cov-report=term-missing
        timeout-minutes: 30

      - name: Test what needs a process to itself
        # The `heavy` tests, one process, after the suite: four-times-size hostile Markdown,
        # which in a worker grown through the rest of the suite took the 2 GB job container
        # over its limit and had the worker killed (2026-10-10).
        #
        # By file: without one, pytest collected all 25,000 tests to keep the 19 marked, about
        # 15 s of every run (#1033). A test marked `heavy` in another file has to be named
        # here as well, which `tests/test_release_tools.py` holds.
        run: uv run pytest -m heavy -p no:xdist tests/security/test_markdown.py
        timeout-minutes: 10

  checks:
    # "Checks" first: the release gate requires a job whose name starts with it
    # (`scripts/release_tools.py`, REQUIRED_JOBS), since lint and the catalogues left the
    # unit legs for here (#712).
    name: "Checks: lint, migrations, catalogues, settings, built files"
    # Everything here reads the same on every Python, so it runs once per push rather than
    # once per leg of the matrix, where it used to cost each leg two and a half minutes.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false
          # The whole history: the translation guard reads every commit of the push or the
          # pull request, and needs `origin/main` to find where a new branch began.
          fetch-depth: 0
          # Every commit and tree, and the files of the checked-out commit alone: the whole
          # pack is 569 MiB, and fetching it was 69 s of this job (#1033). What the guard reads
          # of an older commit is its list of changed paths, which the trees hold, and the
          # catalogues of the few that change one, which git fetches when asked. Forgejo
          # advertises `filter`, so the server serves the partial clone.
          filter: blob:none

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Keep uv's downloads between runs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.14-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ github.event_name != 'pull_request' && format('uv-{0}-3.14-', runner.os) || '' }}

      - name: Install dependencies
        run: uv sync --locked --python 3.14 --no-group e2e

      - name: Lint
        run: |
          uv run ruff check --output-format=full .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test

      - name: Check the translation catalogues are current and consistent
        # Every string in the source has a slot in every catalogue, in the exact layout
        # Weblate writes, every reviewed translation keeps the placeholders of its
        # original, and the plural rules match the table. `status.json` is not checked:
        # `compile` writes it at build time (#349).
        run: |
          uv run python scripts/messages.py extract --check
          uv run python scripts/messages.py check

      - name: Refuse translations written outside Weblate
        # Every translation, correction and review is made at translate.tiagoagueda.com and
        # comes back as Weblate's pull request (#706). Each commit of the push or the pull
        # request is read, and one that writes, changes or reviews a translation is refused
        # unless Weblate made it. The container runs as another user than the one that owns
        # the checkout, which git refuses to read without being told it is safe.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run python scripts/messages.py guard --base "$BASE"

      - name: Weblate's pull request leaves French and Portuguese complete
        # The development gate of #347, where it can hold: a commit adds a string with an
        # empty slot, Weblate drafts it by machine, and its pull request brings the drafts
        # in. A draft counts.
        if: github.head_ref == 'weblate'
        run: uv run python scripts/messages.py gate fr-FR pt-PT

      - name: Production settings deployment check
        # check --deploy, and collectstatic with the manifest storage the image uses,
        # which follows references inside CSS and JS and refuses one that points at
        # nothing — the failure that once broke the image build and not the tests.
        run: |
          uv run manage.py check --deploy --fail-level WARNING
          uv run manage.py collectstatic --noinput --clear
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.prod
          # Long enough to satisfy security.W009; not a real secret.
          POSTULO_SECRET_KEY: ci-only-placeholder-nS7pQ2xV9wR4tY6uI8oA3sD5fG1hJ0kL2zX4cV6b
          POSTULO_ALLOWED_HOSTS: postulo.example.org
          POSTULO_STATIC_ROOT: /tmp/postulo-static

      # The compiled stylesheet is committed so that the application runs without Node.
      # That only works if it is kept in step with its source; the same goes for the
      # icons, the vendored scripts and the mark.
      - run: npm ci

      - name: Rebuild the stylesheet
        run: npm run build:css

      - name: Re-copy the icons
        run: npm run sync:icons

      - name: Re-copy the brand marks
        run: npm run sync:brands

      - name: Re-copy the vendored scripts
        run: npm run sync:vendor

      - name: Fail if the committed stylesheet or icons are out of date
        run: |
          # A container-backed runner may check out as a different user than the one
          # running the steps, and git then refuses to read the repository at all.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- src/postulo/static/css/app.css \
            || (echo "::error::app.css is stale. Run 'npm run build:css' and commit the result." && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/icons)" \
            || (echo "::error::static/icons disagrees with assets/icons.txt. Run 'npm run sync:icons' and commit the result." && git status --porcelain -- src/postulo/static/icons && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/brands)" \
            || (echo "::error::static/brands disagrees with assets/brands.txt. Run 'npm run sync:brands' and commit the result." && git status --porcelain -- src/postulo/static/brands && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/js/vendor)" \
            || (echo "::error::static/js/vendor disagrees with node_modules. Run 'npm run sync:vendor' and commit the result." && git status --porcelain -- src/postulo/static/js/vendor && exit 1)
          test -z "$(git status --porcelain -- src/postulo/static/brand)" \
            || (echo "::error::static/brand disagrees with assets/brand/postulo.png. Run 'uv run python scripts/brand.py' and commit the result." && git status --porcelain -- src/postulo/static/brand && exit 1)

  postgres:
    name: Database tests on PostgreSQL
    # The other engine Postulo offers, against a real server (#219).
    #
    # The job above runs on in-memory SQLite, which is what makes it fast, and it meant
    # that `docker/compose.postgres.yml` and the *Installing Postulo* page had been
    # offering PostgreSQL since `7675bf10d` without a single line of it ever executing.
    # The image had no driver and no pg_dump; `core/backup.py`'s PostgreSQL half was
    # covered only by a monkeypatched `subprocess.run`. None of that is the kind of
    # mistake reading finds -- it is the kind a server finds in ten seconds.
    #
    # A subset rather than the whole suite: the pages, the permissions and the
    # translations do not change with the engine, and the unit job above already runs
    # them. What does change is whether the driver imports, whether the migrations
    # apply, and whether the backup path -- which shells out to pg_dump and pg_restore
    # instead of copying a file -- actually works. That is what this runs, and then it
    # takes a real backup of a seeded instance and puts it back.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    # This runner puts every job on one shared network, so every run's `db` service answers
    # to the same name, and a test could create its database on one server and look for it
    # on another ("database test_postulo does not exist"). The runner drops a service's own
    # --network-alias, so each run's server gets a password of its own instead, and the
    # step "Find this run's database server" keeps the one address that accepts it.
    env:
      PG_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      db:
        # The same major as `docker/compose.postgres.yml` starts, and the reason the
        # client below is installed by major as well: pg_dump refuses a server newer
        # than itself, so testing against 15 would prove nothing about the deployment.
        image: postgres:17
        env:
          POSTGRES_DB: postulo
          POSTGRES_USER: postulo
          # This server exists for the length of one job and holds fictional data; the
          # password only tells it apart from other runs' servers (see PG_PASSWORD).
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        options: >-
          --health-cmd "pg_isready -U postulo -d postulo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install the PostgreSQL client tools
        # From PostgreSQL's own repository and by major version, exactly as
        # `docker/Dockerfile` does it: Debian bookworm ships client 15, and pg_dump
        # against a 17 server aborts on the version mismatch. If this step and the image
        # ever disagree, CI is testing something nobody runs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          install -d /usr/share/postgresql-common/pgdg
          install -m 644 docker/apt.postgresql.org.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-17
          rm -rf /var/lib/apt/lists/*
          pg_dump --version

      - name: Find this run's database server
        # `db` resolves to every run's server on the shared network; only this run's
        # accepts PG_PASSWORD. Its address goes to the later steps as PG_HOST.
        run: |
          for attempt in $(seq 1 30); do
            for ip in $(getent ahostsv4 db | awk '{print $1}' | sort -u); do
              if PGPASSWORD="$PG_PASSWORD" PGCONNECT_TIMEOUT=3 psql -h "$ip" -U postulo -d postulo -Atc "SELECT 1" >/dev/null 2>&1; then
                echo "This run's server is $ip"
                echo "PG_HOST=$ip" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 2
          done
          echo "No server behind db accepts this run's password" >&2
          exit 1

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # --extra postgres, which is where psycopg lives and what the image was missing.
        run: uv sync --locked --python 3.14 --extra postgres --no-group e2e

      - name: Keep the compiled translations between runs
        # Compiling every catalogue took 18 to 37 s of each job that runs tests (#1033), and
        # the result changes only with what the key hashes: every catalogue, the compiler, the
        # language table it reads and the version it writes into status.json. Exact keys only,
        # on every event: an older set of `.mo` files is a set of stale translations, not a
        # head start.
        id: catalogues
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            src/postulo/**/LC_MESSAGES/django.mo
            src/postulo/locale/status.json
          key: catalogues-${{ hashFiles('src/postulo/**/LC_MESSAGES/django.po', 'scripts/messages.py', 'src/postulo/core/messages_tool.py', 'src/postulo/core/languages.py', 'src/postulo/__init__.py') }}

      - name: Compile the translations
        if: steps.catalogues.outputs.cache-hit != 'true'
        run: uv run python scripts/messages.py compile

      - name: Run the database-facing tests against PostgreSQL
        # POSTULO_TEST_DATABASE_URL is the only thing that moves the suite off in-memory
        # SQLite; everything else about the test settings stays as it is.
        # The language columns are here because of what they were: SQLite never held a
        # ten-character column to ten characters, and a migration that rewrites rows and
        # then changes their column is the kind of thing only this engine refuses (#337).
        # Invitations are here for the row lock: two sign-ups can only read one
        # invitation at the same moment on this engine, so only here can one wait (#544).
        run: >-
          uv run pytest tests/test_smoke.py tests/test_ownership.py tests/test_backup.py
          tests/test_language_storage.py tests/test_invites.py
        timeout-minutes: 15
        env:
          POSTULO_TEST_DATABASE_URL: postgres://postulo:${{ env.PG_PASSWORD }}@${{ env.PG_HOST }}:5432/postulo

      - name: Take a backup and put it back, for real
        # Production settings, the shape an operator actually runs, and no monkeypatching
        # anywhere: migrate applies through psycopg, seed_demo writes a believable search,
        # backup shells out to pg_dump, a second account is added so that the restore has
        # something to undo, and restore --force runs pg_restore and has to leave exactly
        # the one account the archive held.
        run: |
          mkdir -p /tmp/postulo-media /tmp/postulo-backups /tmp/postulo-static
          uv run manage.py migrate --noinput
          uv run manage.py seed_demo demo@example.org --no-pdf
          uv run manage.py backup /tmp/postulo-roundtrip.tar.gz
          uv run manage.py seed_demo rival@example.org --no-pdf
          uv run manage.py restore /tmp/postulo-roundtrip.tar.gz --force
          uv run manage.py shell -c "
          from django.contrib.auth import get_user_model
          from postulo.applications.models import Application
          emails = sorted(get_user_model().objects.values_list('email', flat=True))
          assert emails == ['demo@example.org'], emails
          assert Application.objects.exists(), 'the restore brought back an empty instance'
          "
          # The restore is all or nothing (#477). First a table the archive never held
          # and one that points at accounts_user must not survive or block the restore ...
          psql "postgres://postulo:$PG_PASSWORD@$PG_HOST:5432/postulo" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE ci_unreferenced (id integer);
          CREATE TABLE ci_pointing (id integer, owner integer REFERENCES accounts_user (id));"
          uv run manage.py restore /tmp/postulo-roundtrip.tar.gz --force
          uv run manage.py migrate --check
          uv run manage.py shell -c "
          from django.contrib.auth import get_user_model
          from postulo.applications.models import Application
          assert get_user_model().objects.count() == 1
          assert Application.objects.exists()
          "
          test "$(psql "postgres://postulo:$PG_PASSWORD@$PG_HOST:5432/postulo" -Atc "SELECT count(*) FROM pg_tables WHERE tablename LIKE 'ci\_%'")" = 0
          # ... and a dump that breaks half way must leave the database exactly as it was.
          python3 - <<'PY'
          import hashlib, io, json, tarfile
          src = tarfile.open("/tmp/postulo-roundtrip.tar.gz")
          members = {m.name: (m, src.extractfile(m).read() if m.isfile() else None) for m in src.getmembers()}
          dump = members["database.dump"][1]
          dump = dump[: len(dump) * 2 // 3]
          manifest = json.loads(members["manifest.json"][1])
          manifest["database"]["sha256"] = hashlib.sha256(dump).hexdigest()
          manifest["database"]["bytes"] = len(dump)
          members["database.dump"] = (members["database.dump"][0], dump)
          members["manifest.json"] = (members["manifest.json"][0], json.dumps(manifest).encode())
          out = tarfile.open("/tmp/postulo-corrupt.tar.gz", "w:gz")
          for m, data in members.values():
              if data is not None:
                  m.size = len(data)
              out.addfile(m, io.BytesIO(data) if data is not None else None)
          out.close()
          PY
          uv run manage.py seed_demo rival@example.org --no-pdf
          if uv run manage.py restore /tmp/postulo-corrupt.tar.gz --force; then
            echo "a truncated dump was restored" >&2; exit 1
          fi
          uv run manage.py shell -c "
          from django.contrib.auth import get_user_model
          emails = sorted(get_user_model().objects.values_list('email', flat=True))
          assert emails == ['demo@example.org', 'rival@example.org'], emails
          "
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.prod
          POSTULO_DATABASE_URL: postgres://postulo:${{ env.PG_PASSWORD }}@${{ env.PG_HOST }}:5432/postulo
          # Long enough to satisfy security.W009; not a real secret.
          POSTULO_SECRET_KEY: ci-only-placeholder-nS7pQ2xV9wR4tY6uI8oA3sD5fG1hJ0kL2zX4cV6b
          POSTULO_ALLOWED_HOSTS: postulo.example.org
          POSTULO_MEDIA_ROOT: /tmp/postulo-media
          POSTULO_BACKUP_DIR: /tmp/postulo-backups
          POSTULO_STATIC_ROOT: /tmp/postulo-static
          # The demo accounts' password, read from the environment: never from an argument (#980).
          POSTULO_SEED_PASSWORD: ci-only-not-a-secret-either

  security:
    name: Security audit
    # Postulo holds people's CVs and employment histories, and one of its stated
    # commitments is to keep them as secure as it knows how. Part of that is noticing a
    # vulnerability disclosed in a dependency without anyone having to remember to look:
    # every Python package in the lock file and every Node package used to build the
    # assets is checked against the advisory databases, on every push and every week.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config
          # would hand it to every later step and any artifact that packs the tree.
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit the Python dependencies
        # The lock file rather than the installed environment, and the difference is why
        # this job failed on every run for a fortnight: `uv sync` installs Postulo itself
        # as an editable package, `--strict` fails on anything it cannot look up, and
        # Postulo is not on PyPI. The audit never reported on the dependencies at all --
        # it stopped at the project. Exporting the lock without the project audits exactly
        # what will be installed and keeps `--strict`, so a dependency that becomes
        # unauditable still fails the build, which is the whole point of it.
        #
        # No advisory is ignored. The one exception there was (#323, oauthlib) went with
        # django-allauth 65.19.6, which takes oauthlib 4 (#987); an exception added again
        # has to be explained in `tests/test_security_audit.py`, which fails the build for
        # an ignored advisory it does not list.
        #
        # This audit lags the advisories themselves (OSV had nothing for Django 6.1.1 when
        # 6.1.2 fixed four issues, #986), so SECURITY.md also asks for a manual check.
        run: |
          uv export --no-emit-project --all-groups --all-extras --format requirements-txt --no-hashes \
            > /tmp/locked-requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit --strict --progress-spinner off \
            -r /tmp/locked-requirements.txt

      - name: Audit the asset build's Node dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit the workflows themselves
        # A workflow is code that runs with the repository's credentials; zizmor checks
        # for injected expressions, over-broad permissions and unpinned actions.
        #
        # `--offline` is not a concession, it is the correct mode here. zizmor takes a
        # GitHub token from GH_TOKEN or GITHUB_TOKEN, Forgejo Actions sets the latter, and
        # zizmor then asked github.com about `actions/checkout` using a Forgejo token --
        # which github.com answered with 401, failing the whole job. But the deeper problem
        # is that the question was wrong: Forgejo resolves a bare action name against its
        # own instance, as the note at the top of this file says, so what GitHub thinks
        # `actions/checkout@v4` refers to is not what runs here. The online audits would
        # give a confident answer about the wrong host.
        #
        # This is also why it passed on a laptop: with no token in the environment zizmor
        # defaults to offline, so the failure only ever appeared in CI.
        #
        # Pinned, like pip-audit above and uv itself: an auditor that changes under the
        # project is one whose new rule fails a push that changed nothing (#233).
        run: >
          uvx zizmor==1.30.1 --offline --no-progress --config .forgejo/zizmor.yml
          --min-severity medium .forgejo/workflows/*.yml
