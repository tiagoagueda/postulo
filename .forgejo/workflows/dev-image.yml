# Builds a container image from `main`, so a feature can be run before it is released.
#
# Separate from `image.yml` on purpose. That one builds a **release**: it checks out a tag,
# because "a release image built from a moving branch is an image nobody can reproduce", and
# it moves `:latest`. This one is the opposite in both respects, and keeping the release path
# untouched is worth more than sharing its steps — it has one job and it must stay simple.
#
# **Why this may run on a push when `image.yml` may not.** `image.yml` is
# `workflow_dispatch` only because `runs-on: docker` reaches a daemon that is root on the
# host, and the only thing stopping a job from getting there was that nobody pressed the
# button. That is no longer what protects it. The runner answering the `docker` label is a
# **second runner instance, registered to this repository alone**, so Forgejo will not
# schedule any other repository's jobs onto it — enforced by the instance rather than by
# every workflow author remembering. That is what makes an automatic trigger acceptable
# here, and it is the thing to re-read before widening this trigger further (#190).
#
# **`:latest` is never touched.** A dev build reaching it would make `docker pull postulo`
# a dev image for everybody. Two tags only: `:dev`, which moves, and a pinnable
# `:<version>-dev.<short sha>`, because a floating tag nobody can name is no use in a bug
# report.
#
# **The scan gate applies.** A dev image somebody runs against their own applications is an
# image. #155 and #157 were both found in an image built and published without one, and a
# gate skipped "just for dev" is not a gate.
#
# **Two architectures, like the release**, and for a concrete reason: the instance these
# images are run on is a Raspberry Pi. An amd64-only dev image is one nobody can deploy,
# which would leave the channel building something to look at rather than something to run.
# QEMU binfmt is registered on the runner, so `linux/arm64` costs time and nothing else.
#
# **Old dev images are pruned here, after the push.** Every push adds a pinned tag and
# nothing else ever takes one away; the newest `DEV_IMAGES_KEPT` stay -- enough to roll an
# instance back -- and `scripts/prune-dev-images.py` removes the rest, together with the
# per-architecture manifests only they referenced. It runs in this job because this job is
# the only thing that adds one, and after the push so the tag it just made is the newest.
#
# **Only a commit CI passed becomes an image (#716).** The job starts with the push, as it
# always did, and then waits for the commit's CI before it builds anything: an instance
# following `:dev` is given nothing the tests failed on, and the arm64 build under QEMU no
# longer takes the host's processor from the tests while they run. A wait rather than
# `needs:` in ci.yml, because ci.yml also runs for pull requests and release branches, and
# this runner fails a job whose `if` is false instead of skipping it (tried on a throwaway
# branch). The runner answering `docker` is this repository's alone, so the wait holds
# nobody else's job.
name: Dev image

on:
  push:
    branches: [main]
  # Buildable by hand as well, for a rebuild without a commit to cause one.
  workflow_dispatch:

# Nothing is granted by default; this needs to read the code and write to the registry.
permissions: {}

# One at a time, and never two builds of the same branch racing to move `:dev`. A push that
# lands mid-build cancels the older one, because the newer commit is the one anybody wants.
concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  image:
    name: "Dev image: build, scan, push"
    # Belt and braces beside the trigger. A branch filter is one edit away from being wider
    # than somebody meant, and this says the same thing a second time where it is read.
    if: github.ref_name == 'main'
    runs-on: docker
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for CI to pass on this commit
        # The jobs a push's own CI run answers -- the unit tests, the browser and the checks,
        # the ones the release gate asks for -- every one a pass, or nothing is built. A run
        # cancelled by a newer push is not a pass either; that push's own image follows.
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_tools.py wait-ci "$GITHUB_SHA" --minutes 90
        timeout-minutes: 95

      - name: Work out the tags
        id: tags
        env:
          # `GITHUB_SERVER_URL` is the address the *runner* reaches Forgejo at, which on a
          # compose deployment is an internal name -- `http://server:3000`. The daemon that
          # pushes runs on the host, cannot resolve that, and an image named after it could
          # not be pulled by anybody. So the registry is the `REGISTRY_HOST` repository
          # variable, falling back to the server URL with either scheme stripped, for an
          # instance where the two are the same (#190).
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/postulo/__init__.py)"
          test -n "$version" || { echo "no version in src/postulo/__init__.py"; exit 1; }
          registry="${REGISTRY_HOST:-${GITHUB_SERVER_URL#http*://}}"
          # Lowercased: this instance's owner is `Postulo` and a Docker repository name
          # may not carry a capital, so the tag was refused outright (#190).
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="${registry}/${repository}"
          short="$(git rev-parse --short HEAD)"
          # `:dev` moves; the second one is what a bug report can name. Never `:latest`.
          echo "tags=${image}:dev,${image}:${version}-dev.${short}" >> "$GITHUB_OUTPUT"
          echo "pinned=${image}:${version}-dev.${short}" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          registry="${REGISTRY_HOST:-${GITHUB_SERVER_URL#http*://}}"
          echo "$REGISTRY_TOKEN" | docker login "$registry" \
            -u "$REGISTRY_USER" --password-stdin

      # One moment for the run, handed to both builds below (#300). The Dockerfile takes it
      # as POSTULO_APT_REFRESH, which is part of the cache key of the layer that takes
      # Debian's updates: a value the builder has not seen, and the layer runs. Without it
      # that layer was served from cache by both builders, and the image kept the packages
      # of the day the layer was first built.
      #
      # The clock and not the run's number, so a run started again asks again.
      - name: Note the moment Debian is asked
        id: moment
        run: echo "asked=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Into this runner's daemon first, so there is something to scan before anything is
      # published. `--pull`, so the base image is asked for as well, whatever this builder
      # does by default.
      - name: Build the image this runner can scan
        env:
          ASKED: ${{ steps.moment.outputs.asked }}
        run: |
          docker build --pull --build-arg POSTULO_APT_REFRESH="$ASKED" \
            -f docker/Dockerfile -t postulo:dev-scan .

      # The same script a person runs and the same one `image.yml` calls, rather than a
      # third description of the same intent.
      - name: Scan it, with both scanners
        run: ./scripts/scan-image.sh postulo:dev-scan

      # The scan above read the native build; this builds for both architectures and
      # pushes. It is a second builder with a cache of its own -- the logs name it
      # `postulo-dev`, a `docker-container` one, where the scan's is the daemon's -- so
      # nothing here is handed the layers that were scanned. What makes the two images the
      # same is being built from the same commit at the same moment, which is why this build
      # is given the moment the first one was (#300).
      - name: Build for amd64 and arm64 and push
        id: push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          ASKED: ${{ steps.moment.outputs.asked }}
        run: |
          docker buildx create --use --name postulo-dev >/dev/null 2>&1 || docker buildx use postulo-dev
          tags=""
          for tag in $(echo "$TAGS" | tr ',' ' '); do tags="$tags -t $tag"; done
          docker buildx build --pull --build-arg POSTULO_APT_REFRESH="$ASKED" \
            --platform linux/amd64,linux/arm64 -f docker/Dockerfile $tags --push .

      # A failure here fails the run, deliberately: the image is already published, but a
      # prune that stopped working -- a token that lost its scope -- would otherwise be found
      # by a full disk.
      - name: Prune old dev images
        env:
          FORGEJO_USER: ${{ secrets.REGISTRY_USER }}
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          DEV_IMAGES_KEPT: 5
        run: |
          registry="${REGISTRY_HOST:-${GITHUB_SERVER_URL#http*://}}"
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          python3 scripts/prune-dev-images.py --registry "$registry" \
            --owner "${repository%%/*}" --package "${repository##*/}" --keep "$DEV_IMAGES_KEPT"

      # What was built, and from what. A dev tag moves, so the commit is the only thing that
      # identifies what somebody is running. The scan's verdict sits here because a scan that
      # did not complete is not a finding and must not read as one (#192).
      - name: Say what this is
        if: always()
        env:
          ASKED: ${{ steps.moment.outputs.asked }}
        run: |
          {
            echo '## Dev image'
            echo
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`, with Debian's packages as of \`${ASKED}\`."
            echo
            echo "**Scan:** $(cat .scan/verdict.txt 2>/dev/null || echo 'no verdict -- the scan script did not get as far as writing one')"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when the push actually happened. Keyed to that step rather than to the job,
      # because a failure *after* the push -- the prune -- is a published image all the same.
      - name: Say how to pull it
        if: always() && steps.push.outcome == 'success'
        run: |
          {
            echo '```'
            echo 'docker pull ${{ steps.tags.outputs.pinned }}'
            echo '```'
            echo
            echo 'Not a release. Never tagged `latest`, unsupported, and it may change a'
            echo 'database in ways a release will not.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say that nothing was published
        if: always() && steps.push.outcome != 'success'
        run: |
          echo 'Nothing was published: CI did not pass on this commit, or the build or the push did not succeed. The log says which.' >> "$GITHUB_STEP_SUMMARY"
