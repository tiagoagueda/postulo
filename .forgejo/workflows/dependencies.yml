# Keeps the lock file current without anybody remembering to (#233).
#
# CONTRIBUTING.md said "once a month, `uv lock --upgrade`", and nothing did it: the weekly
# audit in ci.yml reports a vulnerability, not staleness, and a lock that is never moved is
# one whose next move is a year of changes at once. So, monthly and on demand, this upgrades
# the lock, runs a quick check against it, and -- only if that passes -- opens a pull
# request with the result. The full check is the pull request's own CI run (every job of
# ci.yml, over every Python, with PostgreSQL, the audit and the browser), which is why the
# pull request is opened with a token that is not the automatic one: Forgejo ignores events
# whose doer is the Actions user, so a branch pushed with it never starts ci.yml (#585). A
# person still reads the changelogs of anything that moved a major version and merges; the
# workflow does the part that was being forgotten.
#
# It writes a branch and opens a pull request, so it needs more than `contents: read`. That
# is why it is its own file rather than a job in ci.yml, where every job only reads. What it
# may write is the bot account's: the repository secret DEPENDENCIES_TOKEN is a token of
# `postulo-bot`, whose team has write access to this repository alone. There is no
# `permissions:` block because Forgejo 16 ignores the field and warns on every job (#727).
#
# Two jobs, because a step boundary is not a privilege boundary (#975). Resolving the lock
# builds source distributions, installing it runs the newest release of every locked
# package, and pytest loads whatever plugins those packages register: all of it as root,
# and anything it leaves behind (a git hook in the checkout, a binary earlier on the PATH)
# would run in the next step of the same container. So `upgrade` has no secret at all and
# hands over two files; `propose` starts from a fresh container, runs nothing from the new
# packages, copies those two files over a clean checkout and is the only job that holds
# the token. tests/test_tooling.py holds the split in place.
name: Dependencies

on:
  schedule:
    # The first Monday-ish of the month, at a quiet hour. Cron has no "first Monday", so
    # this is the 3rd; what matters is once a month, not which day.
    - cron: "23 5 3 * *"
  workflow_dispatch:

env:
  UV_VERSION: "0.12.17"
  # The sha256 of that version's install.sh, checked before it is run: the script is the
  # trust root for the uv binary it then fetches, and `curl | sh` ran whatever the address
  # answered (#790). Bump it with UV_VERSION, see CONTRIBUTING.md.
  UV_INSTALLER_SHA256: "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5"

jobs:
  upgrade:
    name: Monthly dependency upgrade
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    outputs:
      changed: ${{ steps.lock.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Pushed below with the token handed to that one step, not with one left in
          # .git/config for every step after the checkout.
          persist-credentials: false

      - name: Install WeasyPrint's system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upgrade the lock
        id: lock
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv lock --upgrade
          if git diff --quiet -- uv.lock; then
            echo "Nothing moved."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- uv.lock
            # The pre-commit hook formats with the ruff the lock names, or a contributor's
            # hook and CI disagree (tests/test_tooling.py holds the two together).
            ruff_version="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "ruff"))')"
            sed -i -E "/ruff-pre-commit/{n;s/rev: v.*/rev: v${ruff_version}/}" .pre-commit-config.yaml
          fi

      - name: Install the upgraded dependencies
        if: steps.lock.outputs.changed == 'true'
        run: uv sync --locked --python 3.14 --no-group e2e

      - name: Run a quick check against them
        # Ruff, migrations and the suite on Python 3.14 alone: enough that a lock which
        # fails here is not proposed at all, and the run's log says what moved and what
        # broke. It is not the test job: the other Pythons, the translation checks, ESCO,
        # PostgreSQL, the audit and the browser run on the pull request itself.
        if: steps.lock.outputs.changed == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run manage.py makemigrations --check --dry-run
          uv run python scripts/messages.py compile
          uv run pytest -n 2
        env:
          DJANGO_SETTINGS_MODULE: postulo.config.settings.test

      - name: Hand over the two files
        # The only things that cross to the job that holds the token. Renamed because the
        # artifact action of this Forgejo does not carry hidden files reliably.
        if: steps.lock.outputs.changed == 'true'
        run: |
          mkdir handoff
          cp uv.lock handoff/uv.lock
          cp .pre-commit-config.yaml handoff/pre-commit-config.yaml

      - name: Keep them for the next job
        if: steps.lock.outputs.changed == 'true'
        # v3 works on Forgejo Actions; v4 depends on GitHub's own artifact backend.
        uses: actions/upload-artifact@v3
        with:
          name: dependency-lock
          path: handoff
          retention-days: 1

  propose:
    name: Push the branch and open the pull request
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the two files
        uses: actions/download-artifact@v3
        with:
          name: dependency-lock
          path: handoff

      - name: Check and commit them
        run: |
          # Exactly two regular files, and nothing else, whatever the artifact holds.
          [ "$(find handoff -mindepth 1 | wc -l)" = "2" ]
          [ -f handoff/uv.lock ] && [ ! -L handoff/uv.lock ]
          [ -f handoff/pre-commit-config.yaml ] && [ ! -L handoff/pre-commit-config.yaml ]
          cp handoff/uv.lock uv.lock
          cp handoff/pre-commit-config.yaml .pre-commit-config.yaml
          rm -r handoff
          # The pre-commit file may only have moved ruff's revision: one line out, one in.
          changed_lines="$(git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" diff --numstat -- .pre-commit-config.yaml | awk '{ print $1 + $2 }')"
          [ -z "$changed_lines" ] || [ "$changed_lines" -le 2 ]
          # Nothing but the two files may be different from the checkout.
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" status --porcelain | while read -r state path; do
            case "$path" in
              uv.lock|.pre-commit-config.yaml) ;;
              *) echo "Unexpected change: $state $path"; exit 1 ;;
            esac
          done
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" diff --quiet -- uv.lock && { echo "The lock did not change."; exit 1; }
          branch="dependencies/$(date -u +%Y-%m)"
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" checkout -B "$branch"
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" add uv.lock .pre-commit-config.yaml
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" -c user.name="Postulo dependencies" -c user.email="dependencies@postulo.invalid" commit -m "Upgrade the lock file ($(date -u +%Y-%m-%d))" \
            -m "Every dependency moved to its newest version the constraints allow; ruff, the migration check and the suite on Python 3.14 passed against them. The pull request's CI run is the full check. Read the changelogs of anything that crossed a major version before merging."
          echo "$branch" > /tmp/branch

      - name: Push the branch and open the pull request
        env:
          # Through the environment, never expanded into the script: a value that reaches a
          # shell as text is data, one pasted into it is code.
          #
          # A bot account's token (repository secret DEPENDENCIES_TOKEN, with write access
          # to code and pull requests), so the push and the pull request start ci.yml like
          # any other. Without it the automatic token still works, but CI never runs on the
          # pull request, and its body says so.
          TOKEN: ${{ secrets.DEPENDENCIES_TOKEN || secrets.GITHUB_TOKEN }}
          BOT_TOKEN_SET: ${{ secrets.DEPENDENCIES_TOKEN != '' && 'yes' || 'no' }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="$(cat /tmp/branch)"
          # The token in the URL of this one push, not in .git/config.
          git -c core.hooksPath=/dev/null -c safe.directory="$GITHUB_WORKSPACE" push --force "${SERVER%%://*}://x-access-token:${TOKEN}@${SERVER#*://}/${REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          python3 - "$branch" <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          branch = sys.argv[1]
          server, repository, token = os.environ["SERVER"], os.environ["REPOSITORY"], os.environ["TOKEN"]
          base = os.environ["BASE"]
          ci = (
              "CI on this pull request is the full check; merge only when it is green."
              if os.environ["BOT_TOKEN_SET"] == "yes"
              else "No bot token is configured (secret `DEPENDENCIES_TOKEN`), so CI did not run on this pull request: run it by hand before merging."
          )
          api = f"{server.rstrip('/')}/api/v1/repos/{repository}"
          def call(method, path, body=None):
              request = urllib.request.Request(api + path, method=method, data=json.dumps(body).encode() if body else None)
              request.add_header("Authorization", f"token {token}")
              request.add_header("Accept", "application/json")
              if body is not None:
                  request.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read() or b"null")
          open_ones = call("GET", "/pulls?state=open&limit=50")
          if any(pull.get("head", {}).get("ref") == branch for pull in open_ones):
              print(f"A pull request for {branch} is already open; the branch was updated under it.")
          else:
              pull = call("POST", "/pulls", {
                  "head": branch,
                  "base": base,
                  "title": f"Upgrade the lock file ({branch.split('/')[-1]})",
                  "body": (
                      "Every locked dependency upgraded, by the Dependencies workflow. Before opening this, "
                      "ruff, the migration check and the suite passed on Python 3.14 alone. "
                      + ci + " Before merging, read the changelogs of anything that "
                      "crossed a major version, and land the lock file on its own, as CONTRIBUTING.md asks."
                  ),
              })
              print(f"Opened {pull['html_url']}")
          PY
