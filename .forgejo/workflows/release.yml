# Runs when a release tag (vX.Y.Z) is pushed. Nothing here creates a tag: a person does
# that, deliberately, after writing the changelog section and bumping the version.
#
# One job, on purpose. It refuses a tag that disagrees with pyproject.toml, __version__ or
# CHANGELOG.md, builds the sdist and the wheel, and creates the Forgejo release with that
# changelog section as its notes and the two files attached.
#
# There used to be a second job here that built the container image, and it is the reason
# this file says "one job, on purpose". It asked for a runner advertising the `docker`
# label, because building an image needs a Docker daemon and the default runner has none.
# Forgejo schedules a job before it evaluates the `if` that would skip it, so the job was
# neither skipped nor failed: it queued, for ever, and the run never finished. v0.2.0 was
# published, complete, with its release run sitting in `waiting` (#81). Giving `runs-on` an
# expression moved the symptom rather than removing it -- the job then failed in zero
# seconds, having run no steps, which is what an unschedulable job looks like when it is not
# left hanging.
#
# So the image build lives in image.yml and is started by hand. A workflow nobody starts
# cannot queue, and this run always finishes.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing is granted by default; the release job needs to write releases, nothing else.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refuse a tag that disagrees with the code or the changelog
        run: uv run --no-project python scripts/release_tools.py check "${GITHUB_REF_NAME}"

      - name: Compile the translations into the package
        run: uv run --no-project python scripts/messages.py compile

      - name: Build the sdist and the wheel
        run: uv build

      - name: Write the release notes from the changelog
        run: uv run --no-project python scripts/release_tools.py notes "${GITHUB_REF_NAME#v}" -o release-notes.md

      - name: Create the Forgejo release and attach the files
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
        run: uv run --no-project python scripts/release_tools.py publish "${GITHUB_REF_NAME}" dist/* --notes release-notes.md
