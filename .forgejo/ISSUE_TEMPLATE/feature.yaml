name: Feature request
about: Ask for something Postulo does not do yet.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write in whatever language you can; English is easiest for the maintainer to act on.

        Describe the problem before the solution: a feature is judged by the problem it removes. Do not paste personal details such as a CV, an address or the name of somebody you applied to.
  - type: textarea
    id: problem
    attributes:
      label: The problem, and who has it
      description: What gets in the way, for whom, and how often.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other ways to solve it, and what you do today.
  - type: checkboxes
    id: commitments
    attributes:
      label: The four commitments it touches
      description: Postulo is never paywalled, secure because of what it holds, usable by everyone, and modular. Tick any this bears on and say how below.
      options:
        - label: Never paywalled
        - label: Secure
        - label: Usable by everyone
        - label: Modular
  - type: textarea
    id: commitments-how
    attributes:
      label: How it touches them
      description: Could it be a plugin rather than part of the core?
