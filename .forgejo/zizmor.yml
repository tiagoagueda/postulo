# zizmor audits the workflows themselves (run by the security job in ci.yml).
#
# Forgejo resolves `actions/checkout` and `actions/upload-artifact` against its own
# instance, not GitHub, so pinning them to a GitHub commit hash would point at a commit
# the instance may not have. A tag pin is what Forgejo can honour; everything else is
# held to zizmor's defaults.
#
# ci.yml has no `permissions:` block because Forgejo 16 ignores the field and warns about
# it; what a job may do beyond reading is granted by the instance's Authorized Integrations.
# The same goes for every other workflow here: their writes go through the automatic token
# (releases) or a secret (the registry, the dependency bot's token), none of which a block
# could change (#727).
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
  excessive-permissions:
    ignore:
      - ci.yml
      - release.yml
      - image.yml
      - dev-image.yml
      - dependencies.yml
      - every-python.yml
