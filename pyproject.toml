[project]
name = "postulo"
version = "0.4.0"
description = "Self-hosted job application manager, from the applicant's side of the table."
readme = "README.md"
requires-python = ">=3.12.4"
license = "AGPL-3.0-or-later"
authors = [{ name = "Postulo contributors" }]
keywords = ["django", "self-hosted", "job-search", "job-applications", "cv", "resume"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth[mfa,socialaccount]>=65.19",
    "django-environ>=0.14",
    "django-htmx>=1.29",
    "django-ninja>=1.7",
    # Django 6.1 ships the Tasks API but no worker; this adds the ORM-backed
    # backend and the `db_worker` process that executes queued tasks.
    "django-tasks-db>=0.13",
    "whitenoise>=6.12",
    # Fetching a posting the user pasted. Chosen over requests for its explicit timeouts
    # and for letting redirects be followed by hand, which capture needs in order to
    # revalidate every hop. Held to one minor: `plugins/http.py` reaches the client's own
    # transports by httpx's private names to hold a download to a deadline (#321), and a
    # client that had renamed them would run with no deadline and say nothing. Raising
    # the ceiling is a deliberate act that runs `tests/security/test_outbound.py`.
    "httpx>=0.28,<0.29",
    # What httpx 0.28 connects with, and already installs. Named because `plugins/http.py`
    # wraps its network backend to hold a download to a deadline (#321), so it is imported
    # by name and is no longer only somebody else's dependency.
    "httpcore>=1.0,<2",
    # The default PDF renderer. A small Python dependency, but it loads Pango through
    # the system linker: see the [chromium] extra for machines where that is awkward.
    "weasyprint>=70",
    "cryptography>=43",
    # Version specifiers, for the one check a catalogue release declares and the
    # installer has to make: which Postulo the plugin is for (#186).
    "packaging>=24",
    # Components for the templates: `<c-field :field="form.name" />` rather than an include
    # with a `with` chain. Server-side only -- no CSS, no script, no CSP surface (#263).
    "django-cotton>=2.7.2",
    # Parsing an uploaded SVG before sanitising it (#264). Pure Python, and what it buys is
    # the refusals a plain `xml.etree` will not make: a document type declaration, an
    # external entity, the billion-laughs expansion. The allowlist walk is ours; this is
    # the part that has to hold before the walk begins.
    "defusedxml>=0.7",
    # Every country's numbering plan (#304): which numbers can exist, where a trunk prefix
    # is and is not part of the number, and how each country groups its digits. Google's
    # libphonenumber metadata as pure Python, in the build without the geocoding, carrier
    # and time-zone tables, which nothing here asks for. Apache-2.0. Only `core/phones.py`
    # imports it. Held to the major: the metadata changes every few weeks and wants taking,
    # the functions have not changed in years.
    "phonenumberslite>=9.0,<10",
    # The names of the countries in every language Postulo speaks (#534), from the CLDR tables
    # it carries: GeoNames' country file has the English name only, so "Valencia, España"
    # narrowed nothing. BSD-3-Clause. `jobs/places.py` and, since #689, `core/language_names.py`
    # (what a language is called, in every language) import it. The locale data is most of
    # its installed size (about 33 MB) and is loaded one language at a time. Held to one
    # minor, the one whose CLDR (47) the capitalisation rules of `language_names` were read
    # from: `tests/test_language_names.py` fails when an upgrade changes the data beneath
    # them, and raising the ceiling is the act of checking them again.
    "babel>=2.18,<2.19",
    # A listing's description in Markdown, rendered on the server (#665). `core/markdown.py`
    # is the only importer: the parser with raw HTML off and a short list of rules, then
    # `nh3` (the Rust `ammonia`, abi3 wheels, no compiler) over what it wrote, as the second
    # half of one defence. MIT both.
    "markdown-it-py>=4.2,<5",
    "nh3>=0.3.7,<0.4",
    "icalendar>=7.1.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# A fallback renderer for machines where WeasyPrint's system libraries are impractical,
# Windows in particular. Needs `playwright install chromium` afterwards.
chromium = ["playwright>=1.62"]
# What the container runs. Not a development dependency: runserver is Django's own.
server = ["gunicorn>=23.0"]

[project.urls]
Homepage = "https://source.tiagoagueda.com/postulo/postulo"
Source = "https://source.tiagoagueda.com/postulo/postulo"
Issues = "https://source.tiagoagueda.com/postulo/postulo/issues"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.14",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.16",
    "pre-commit>=4.0",
    "django-stubs[compatible-mypy]>=5.1 ; python_version < '3.14'",
    "pytest-xdist>=3.8",
]
e2e = [
    "playwright>=1.62",
    "pytest-playwright>=0.9",
]

# Both groups are installed by default so that `uv add` and `uv sync` never quietly remove
# the browser test's dependencies; the browser itself is still a `playwright install` away.
[tool.uv]
default-groups = ["dev", "e2e"]

[project.scripts]
# The catalogue tool, for a plugin repository to run against itself (#187).
postulo-messages = "postulo.core.messages_tool:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "postulo"
module-root = "src"

# ------------------------------------------------------------------------ tooling

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "PIE794",  # a class field declared twice
    "S",    # bandit
    "T20",  # no stray print()
    "RUF",
]
ignore = [
    "S101",  # assert is how pytest works
    # Postulo is written in British English and uses proper typography in the strings
    # a person actually reads: curly quotes, en dashes in ranges. Ruff reads those as
    # "ambiguous unicode", which here is the intended text rather than a mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Command-line tools talk to the person through print. The catalogue tool is one, in
# the package so a plugin repository can run it (#187).
"scripts/*" = ["T201"]
"src/postulo/core/messages_tool.py" = ["T201"]
# Declarative Meta and admin classes hold dicts and lists by design; RUF012 wants
# ClassVar on all of them, which adds noise to every Django class in the project.
"src/postulo/*/forms.py" = ["RUF012"]
"src/postulo/core/server_forms.py" = ["RUF012"]
"src/postulo/*/admin.py" = ["RUF012"]
"src/postulo/*/views.py" = ["RUF012"]
"src/postulo/*/models.py" = ["RUF012"]
"src/postulo/config/settings/*" = ["F403", "F405"]
# django-ninja declares query and header parameters as `Query(...)` and `Header(...)`
# defaults; that is its documented idiom, not the mutable-default mistake bugbear is
# looking for.
"src/postulo/api/routers/*" = ["B008"]
"src/postulo/api/api.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["postulo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "postulo.config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Browser, release and CI-step tests are opted into with `-m e2e`, `-m release` or `-m step`;
# a command-line -m replaces this one.
addopts = "--strict-markers --strict-config -m 'not e2e and not release and not step'"
markers = [
    "e2e: drives a real browser against a live server; needs `playwright install chromium`",
    "release: a promise that must hold in a published version, not in every commit",
    "step: the same check a step of CI's Checks job makes once per push; run with `-m step`",
]
filterwarnings = ["error"]
# A test still running after five minutes has its threads' stacks written to the log, so a
# hang on CI names where it stands instead of ending at the job's limit in silence (#712).
faulthandler_timeout = 300

[tool.coverage.run]
source = ["src/postulo"]
omit = ["*/migrations/*", "*/config/wsgi.py", "*/config/asgi.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
# The floor. Measured at 94% when this was set (#233); a change that drops the suite below
# it fails the coverage leg of CI, which is one leg of three so the number is measured once.
fail_under = 92
